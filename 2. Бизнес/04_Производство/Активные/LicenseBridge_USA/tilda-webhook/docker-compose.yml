name: licensebridge-tilda-webhook

services:
  webhook:
    build: .
    container_name: lb-tilda-webhook
    restart: unless-stopped
    env_file: .env
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    container_name: lb-tilda-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - webhook

volumes:
  caddy_data:
  caddy_config:
