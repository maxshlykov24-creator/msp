# Прод: API на localhost, postgres внутри сети. Поднимать с .env.
#   cd talkme-amojo-bridge && docker compose up -d --build
# Nginx+HTTPS на хосте → proxy к 127.0.0.1:19080 (см. deploy/nginx.example.conf)

name: talkme-amojo-bridge

services:
  db:
    image: dockerhub.timeweb.cloud/library/postgres:16-alpine
    environment:
      POSTGRES_USER: bridge
      POSTGRES_PASSWORD: bridge
      POSTGRES_DB: bridge
    volumes:
      - talkme_amojo_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bridge -d bridge"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://bridge:bridge@db:5432/bridge
    ports:
      - "127.0.0.1:19080:8080"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080

volumes:
  talkme_amojo_pg:
