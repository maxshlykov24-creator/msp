# Прод: API на localhost, postgres внутри сети, отдельный worker со сбором.
#   cd dkacademy-analytics && docker compose up -d --build
# Nginx+HTTPS на хосте → proxy к 127.0.0.1:19090 (см. deploy/nginx/dkacademy-analytics.conf)

name: dkacademy-analytics

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dkanalytics
      POSTGRES_PASSWORD: dkanalytics
      POSTGRES_DB: dkanalytics
    volumes:
      - dkacademy_analytics_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dkanalytics -d dkanalytics"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://dkanalytics:dkanalytics@db:5432/dkanalytics
      RUN_MODE: api
    ports:
      - "127.0.0.1:19090:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://dkanalytics:dkanalytics@db:5432/dkanalytics
      RUN_MODE: worker
    depends_on:
      db:
        condition: service_healthy
    command: python -m app.scheduler

volumes:
  dkacademy_analytics_pg:
