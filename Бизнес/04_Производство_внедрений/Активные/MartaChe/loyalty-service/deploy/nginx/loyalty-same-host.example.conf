# Пример: один HTTPS-домен, Tilda/старый backend + loyalty-service.
# Tilda-интеграция остаётся на своих путях; МойСклад бьёт только в /webhook/moysklad
#
# Подставь: server_name, SSL-пути, upstream для Tilda (порт/сокет существующего приложения),
# для loyalty — docker bind 127.0.0.1:18080 (см. docker-compose.timeweb.yml).

upstream loyalty_api {
    server 127.0.0.1:18080;
}

# upstream tilda_or_existing { server 127.0.0.1:3000; }

server {
    listen 443 ssl http2;
    server_name neurosell-tilda-ms-order-hook-5f6f.twc1.net;

    # ssl_certificate /path/fullchain.pem;
    # ssl_certificate_key /path/privkey.pem;

    # --- МойСклад: только этот префикс ведёт в loyalty-service ---
    location /webhook/moysklad {
        proxy_pass http://loyalty_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://loyalty_api/health;
        proxy_set_header Host $host;
    }

    # --- Остальное: как у тебя сейчас для Tilda (раскомментируй и настрой) ---
    # location / {
    #     proxy_pass http://tilda_or_existing;
    #     ...
    # }
}
