services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kassa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен}
      POSTGRES_DB: ${POSTGRES_DB:-kassa}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kassa} -d ${POSTGRES_DB:-kassa}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Порт наружу не пробрасываем — доступ только из сети compose.

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-kassa}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-kassa}
      HOST: 0.0.0.0
      PORT: 3001
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3001" # только локально, наружу проксирует nginx
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE: /api
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:8080:80" # наружу проксирует host nginx (TLS/certbot)

volumes:
  pgdata:
