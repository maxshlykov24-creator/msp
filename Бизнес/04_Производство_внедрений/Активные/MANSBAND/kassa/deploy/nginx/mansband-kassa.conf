# Host-nginx на VPS: терминирует HTTPS (certbot) и проксирует всё на web-контейнер
# (127.0.0.1:8080), который сам раздаёт статику и проксирует /api и /ws на api.
#
# Установка:
#   sudo cp deploy/nginx/mansband-kassa.conf /etc/nginx/sites-available/mansband-kassa
#   sudo ln -sf /etc/nginx/sites-available/mansband-kassa /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d mansband-kassa.ru -d www.mansband-kassa.ru -m info@msproduct.ru --agree-tos
#
# certbot сам допишет ssl-секцию и редирект 80→443.

server {
    listen 80;
    listen [::]:80;
    server_name mansband-kassa.ru www.mansband-kassa.ru;

    # certbot webroot (до выпуска сертификата)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}

# Карта для корректного апгрейда WebSocket (добавить в http-блок, если ещё нет):
#   map $http_upgrade $connection_upgrade { default upgrade; '' close; }
