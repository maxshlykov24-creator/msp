# Статьи учёта (v1). Группа → список статей.
# Переводы между своими счетами — группа «Прочие», в расход месяца не входят.

groups:
  Доходы:
    - Внедрение
    - Партнерка
    - Поддержка
    - Доп. заработок
    - Кэшбэк
    - Подарки нам
    - Прочие доходы

  Расходы обязательные:
    - Продукты
    - Транспорт
    - Связь и интернет
    - Здоровье
    - Бытовые расходы
    - Аренда квартиры
    - Коммуналка
    - Насте

  Расходы второстепенные:
    - Такси
    - Рестораны и кафе
    - Фастфуд
    - Подписки
    - Развлечения
    - Уход за собой
    - Одежда
    - Покупки для себя
    - Образование
    - Путешествия
    - Банковские комиссии

  Расходы на других:
    - Подарки другим

  Десятина и пожертвования:
    - Десятина
    - Пожертвования

  Кредиты и займы:
    - Платеж по кредиту
    - Кредиты и займы выданные
    - Кредиты и займы полученные

  Расходы бизнес:
    - Бизнес

  Сбережения и накопления:
    - Накопление
    - Подушка

  Прочие:
    - Перевод между счетами
    - Прочие расходы
    - Неразмечено

# Какие группы считаются расходом / доходом / игнором в месячной сводке
rollup:
  income: [Доходы]
  expense:
    - Расходы обязательные
    - Расходы второстепенные
    - Расходы на других
    - Десятина и пожертвования
    - Кредиты и займы
    - Расходы бизнес
    - Сбережения и накопления
  ignore: [Прочие]  # переводы и прочее без влияния на «расход месяца»
