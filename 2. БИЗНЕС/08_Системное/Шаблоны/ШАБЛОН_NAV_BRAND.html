<!-- === HTML (в <nav>, перед <ul>) === -->
<!--
  Плейсхolders:
  - {CLIENT_ALT} — название клиента
  - {CLIENT_LOGO} — assets/logo-{client}-transparent.png (или logo-client.png)
  - {INSTRUCTION_TITLE} — заголовок инструкции в nav
  Если лого клиента нет — заменить блок client-logo на:
    <div class="nav-brand-client">{CLIENT_ALT}</div>
-->
<div class="nav-brand">
  <div class="nav-brand-logo">
    <img class="ms" src="assets/logo-ms-transparent.png" alt="MS Product" width="56" height="64">
  </div>
  <div class="nav-brand-ms">MS Product</div>
  <div class="nav-brand-divider"></div>
  <div class="nav-brand-client-logo">
    <img class="client" src="assets/logo-client-transparent.png" alt="{CLIENT_ALT}">
  </div>
  <div class="nav-brand-title">{INSTRUCTION_TITLE}</div>
</div>
