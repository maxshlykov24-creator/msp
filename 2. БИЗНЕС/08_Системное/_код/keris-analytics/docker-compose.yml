# На Keris VPS дашборд живёт systemd (тот же Postgres, что у записи).
# Этот compose — запасной контур по образцу licensebridge-analytics.
name: keris-analytics

services:
  app:
    build: .
    container_name: keris-analytics
    restart: unless-stopped
    mem_limit: 280m
    memswap_limit: 280m
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - keris_analytics_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8092:8092"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8092/health >/dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    command: uvicorn app.main:app --host 0.0.0.0 --port 8092

volumes:
  keris_analytics_data:
