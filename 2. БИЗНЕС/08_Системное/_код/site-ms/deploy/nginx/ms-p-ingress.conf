server {
    listen 80;
    listen [::]:80;
    server_name ms-p.ru www.ms-p.ru;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://ms-p.ru$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ms-p.ru www.ms-p.ru;
    ssl_certificate /etc/nginx/ms-p-ingress-tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/ms-p-ingress-tls/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    access_log /var/log/nginx/ms-p-ingress.access.log;
    error_log /var/log/nginx/ms-p-ingress.error.log;
    client_max_body_size 2m;

    location / {
        proxy_pass https://origin.ms-p.ru;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host origin.ms-p.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_ssl_name origin.ms-p.ru;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 5;
        proxy_redirect https://origin.ms-p.ru/ https://ms-p.ru/;
        proxy_cookie_domain origin.ms-p.ru ms-p.ru;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
