server {
    listen 80;
    listen [::]:80;
    server_name origin.ms-p.ru;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://origin.ms-p.ru$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name origin.ms-p.ru;
    ssl_certificate /etc/letsencrypt/live/ms-p-origin/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ms-p-origin/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /yuji { return 301 /yuji/; }
    location ^~ /yuji/ {
        proxy_pass http://127.0.0.1:18764/;
        proxy_http_version 1.1;
        proxy_set_header Host ms-p.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 2m;
        proxy_read_timeout 60s;
    }
    location / {
        proxy_pass http://127.0.0.1:19091;
        proxy_http_version 1.1;
        proxy_set_header Host ms-p.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
