<!-- ============================================================
     Keris Club — окно онлайн-записи для кнопок сайта (Tilda)
     Кнопку НЕ добавляем: ваши кнопки «Записаться» остаются как есть.
     В ссылке каждой такой кнопки укажите: #keris-book
     ============================================================ -->

<div class="keris-modal" id="kerisModal" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Онлайн-запись Keris Club">
  <div class="keris-modal__backdrop" onclick="kerisBookClose()"></div>
  <div class="keris-modal__card">
    <button type="button" class="keris-modal__close" onclick="kerisBookClose()" aria-label="Закрыть">&times;</button>
    <div class="keris-modal__loader" id="kerisLoader">Загружаем запись…</div>
    <iframe id="kerisFrame" title="Онлайн-запись Keris Club" allow="clipboard-write"></iframe>
  </div>
</div>

<style>
  .keris-modal{
    position:fixed;inset:0;z-index:99999;
    height:100vh;height:100dvh;
    display:flex;align-items:center;justify-content:center;
    visibility:hidden;pointer-events:none;
  }
  .keris-modal.is-open,
  .keris-modal.is-closing{
    visibility:visible;pointer-events:auto;
  }

  /* Фон разделён на два слоя: блюр «садится» быстро (иначе на Safari дёргается),
     а тёмный тон плавно набирает насыщенность — именно это движение глаз читает как «дорого». */
  .keris-modal__backdrop{position:absolute;inset:0}
  .keris-modal__backdrop::before,
  .keris-modal__backdrop::after{
    content:"";position:absolute;inset:0;opacity:0;will-change:opacity;
  }
  .keris-modal__backdrop::before{
    -webkit-backdrop-filter:blur(8px) saturate(1.05);
    backdrop-filter:blur(8px) saturate(1.05);
    transition:opacity .45s ease-out;
  }
  .keris-modal__backdrop::after{
    background:rgba(46,34,29,.46);
    transition:opacity .9s cubic-bezier(.19,1,.22,1);
  }
  .keris-modal.is-open .keris-modal__backdrop::before,
  .keris-modal.is-open .keris-modal__backdrop::after{opacity:1}
  .keris-modal.is-closing .keris-modal__backdrop::before{opacity:0;transition:opacity .3s ease-in}
  .keris-modal.is-closing .keris-modal__backdrop::after{opacity:0;transition:opacity .3s ease-in}

  .keris-modal__card{
    position:relative;z-index:1;
    width:min(430px, calc(100vw - 24px));
    height:min(860px, calc(100vh - 24px));
    background:#fafaf2;border-radius:22px;overflow:hidden;
    box-shadow:
      0 4px 24px rgba(91,68,57,.08),
      0 28px 80px rgba(91,68,57,.28);
    opacity:0;
    transform:translate3d(0,26px,0) scale(.965);
    transition:
      opacity .7s cubic-bezier(.19,1,.22,1) .1s,
      transform .95s cubic-bezier(.16,1,.3,1) .1s;
    will-change:transform,opacity;
  }
  .keris-modal.is-open .keris-modal__card{
    opacity:1;
    transform:translate3d(0,0,0) scale(1);
  }
  .keris-modal.is-closing .keris-modal__card{
    opacity:0;
    transform:translate3d(0,14px,0) scale(.98);
    transition:opacity .26s ease-in, transform .3s ease-in;
  }

  .keris-modal__card iframe{width:100%;height:100%;border:0;display:block;background:#fafaf2}
  .keris-modal__close{
    position:absolute;
    top:max(10px, env(safe-area-inset-top, 0px));
    right:max(12px, env(safe-area-inset-right, 0px));
    z-index:2;cursor:pointer;
    width:40px;height:40px;border:0;border-radius:50%;
    background:rgba(255,255,255,.96);color:#4a3c36;font-size:26px;line-height:38px;
    box-shadow:0 4px 14px rgba(120,90,85,.18);
    opacity:0;
    transition:opacity .4s ease-out .32s, transform .2s ease;
  }
  .keris-modal.is-open .keris-modal__close{opacity:1}
  .keris-modal.is-closing .keris-modal__close{opacity:0;transition:opacity .15s ease-in}
  .keris-modal__close:hover{transform:scale(1.05);background:#fff}
  .keris-modal__loader{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font:400 14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#a99a93;
  }

  /* Мобилка: мягкое проявление на месте, без вспышки.
     Тёмный тон набирается медленно; scale почти незаметный — глаз читает fade, не «прыжок». */
  @media (max-width:520px){
    .keris-modal{align-items:stretch;justify-content:stretch}
    .keris-modal__backdrop::before{transition:opacity .55s ease-out}
    .keris-modal__backdrop::after{transition:opacity .85s cubic-bezier(.19,1,.22,1)}
    .keris-modal.is-closing .keris-modal__backdrop::before,
    .keris-modal.is-closing .keris-modal__backdrop::after{transition:opacity .28s ease-in}

    .keris-modal__card{
      width:100%;height:100%;
      border-radius:0;
      transform:scale(.985);
      transition:
        opacity .8s cubic-bezier(.19,1,.22,1) .12s,
        transform .9s cubic-bezier(.16,1,.3,1) .12s;
    }
    .keris-modal.is-open .keris-modal__card{
      transform:scale(1);
    }
    .keris-modal.is-closing .keris-modal__card{
      transform:scale(.99);
      transition:opacity .24s ease-in, transform .28s ease-in;
    }
    .keris-modal__close{
      top:calc(10px + env(safe-area-inset-top, 0px));
      right:calc(16px + env(safe-area-inset-right, 0px));
      transition:opacity .45s ease-out .35s, transform .2s ease;
    }
  }

  @media (prefers-reduced-motion:reduce){
    .keris-modal__backdrop::before,
    .keris-modal__backdrop::after,
    .keris-modal__card,
    .keris-modal__close{transition:none!important}
  }
</style>

<script>
(function(){
  var KERIS_BOOKING_URL = "https://194.87.118.214.sslip.io/";
  var CLOSE_MS = 320;

  var modal, frame, loader, loaded = false, scrollY = 0, closing = false, closeTimer = null;

  function el(id){ return document.getElementById(id); }

  function nextFrame(cb){
    // Двойной rAF — надёжнее синхронного reflow: гарантирует, что браузер
    // успел закоммитить «стартовый» кадр до добавления класса is-open,
    // иначе часть браузеров (особенно мобильный Safari) пропускает transition.
    requestAnimationFrame(function(){ requestAnimationFrame(cb); });
  }

  window.kerisBookOpen = function(){
    modal = modal || el("kerisModal");
    frame = frame || el("kerisFrame");
    loader = loader || el("kerisLoader");
    if(!modal) return;
    if(closeTimer){ clearTimeout(closeTimer); closeTimer = null; }
    closing = false;
    modal.classList.remove("is-closing");
    if(!loaded){
      frame.addEventListener("load", function(){ if(loader) loader.style.display = "none"; });
      frame.src = KERIS_BOOKING_URL + (KERIS_BOOKING_URL.indexOf("?") > -1 ? "&" : "?") + "from=site";
      loaded = true;
    }
    scrollY = window.scrollY || window.pageYOffset || 0;
    modal.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";
    nextFrame(function(){ modal.classList.add("is-open"); });
  };

  window.kerisBookClose = function(){
    if(!modal || !modal.classList.contains("is-open") || closing) return;
    closing = true;
    modal.classList.remove("is-open");
    modal.classList.add("is-closing");
    closeTimer = setTimeout(function(){
      modal.classList.remove("is-closing");
      modal.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
      window.scrollTo(0, scrollY);
      closing = false;
      closeTimer = null;
    }, CLOSE_MS);
  };

  document.addEventListener("keydown", function(e){
    if(e.key === "Escape") window.kerisBookClose();
  });

  document.addEventListener("click", function(e){
    var a = e.target.closest && e.target.closest('a[href="#keris-book"], a[href*="#keris-book"]');
    if(a){ e.preventDefault(); window.kerisBookOpen(); }
  });
})();
</script>
