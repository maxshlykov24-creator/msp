name: ff-sync

services:
  worker:
    image: ff-sync
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      FF_DB: /data/ff.db
      TZ: Europe/Moscow
    volumes:
      - ff_data:/data
    command: python main.py

  web:
    image: ff-sync
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      FF_DB: /data/ff.db
      TZ: Europe/Moscow
    volumes:
      - ff_data:/data
    ports:
      - "8787:8787"
    command: python -m uvicorn web:app --host 0.0.0.0 --port 8787

  edge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./edge/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./edge/certs:/etc/nginx/certs:ro
      - ./edge/acme:/var/www/certbot:ro
    depends_on:
      - web

volumes:
  ff_data:
