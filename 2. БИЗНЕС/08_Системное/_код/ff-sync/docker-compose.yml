name: ff-sync

services:
  worker:
    image: ff-sync
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      FF_DB: /data/ff.db
      TZ: Europe/Moscow
    volumes:
      - ff_data:/data
    command: python main.py

  web:
    image: ff-sync
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      FF_DB: /data/ff.db
      TZ: Europe/Moscow
    volumes:
      - ff_data:/data
    ports:
      - "8787:8787"
      - "80:8787"
    command: python -m uvicorn web:app --host 0.0.0.0 --port 8787

volumes:
  ff_data:
