# Внешний край кабинета Берёзы. Живёт на VPS 72.56.240.103
# (там же касса MANSBAND). Копия на сервере: /etc/nginx/sites-available/berezagrp
#
# 16.09.2026 прод переехал на 194.87.27.142. Этот край остаётся запасным входом
# (sslip и, если DNS ещё не переключён, кто зайдёт через кассовый IP).
# Кассу MANSBAND этот файл не трогает.

upstream bereza_origin {
    server 194.87.27.142:80 max_fails=2 fail_timeout=10s;
    server 194.87.27.142:8787 backup;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name berezagrp.ru www.berezagrp.ru 72.56.240.103.sslip.io;

    # webroot для Let's Encrypt: как только домен смотрит сюда,
    # HTTP-01 проходит и продление идёт таймером certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://bereza_origin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        client_max_body_size 50m;
    }

    error_page 502 503 504 /__down.html;
    location = /__down.html {
        internal;
        default_type text/html;
        charset utf-8;
        return 503 '<!doctype html><meta charset="utf-8"><title>Кабинет склада</title><body style="font:16px/1.5 system-ui;padding:40px;max-width:520px"><h2>Кабинет перезапускается</h2><p>Панель недоступна одну минуту. Обнови страницу. Если не поднялась через пять минут — напиши Максиму.</p>';
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name berezagrp.ru www.berezagrp.ru;

    ssl_certificate     /etc/nginx/certs/berezagrp/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/berezagrp/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://bereza_origin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        client_max_body_size 50m;
    }

    error_page 502 503 504 /__down.html;
    location = /__down.html {
        internal;
        default_type text/html;
        charset utf-8;
        return 503 '<!doctype html><meta charset="utf-8"><title>Кабинет склада</title><body style="font:16px/1.5 system-ui;padding:40px;max-width:520px"><h2>Кабинет перезапускается</h2><p>Панель недоступна одну минуту. Обнови страницу. Если не поднялась через пять минут — напиши Максиму.</p>';
    }
}

# Резервный вход по IP-имени: работает всегда, даже если домен ещё смотрит
# на больную ноду. Этот адрес и давать складу как страховку.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 72.56.240.103.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/72.56.240.103.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/72.56.240.103.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://bereza_origin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        client_max_body_size 50m;
    }

    error_page 502 503 504 /__down.html;
    location = /__down.html {
        internal;
        default_type text/html;
        charset utf-8;
        return 503 '<!doctype html><meta charset="utf-8"><title>Кабинет склада</title><body style="font:16px/1.5 system-ui;padding:40px;max-width:520px"><h2>Кабинет перезапускается</h2><p>Панель недоступна одну минуту. Обнови страницу. Если не поднялась через пять минут — напиши Максиму.</p>';
    }
}
