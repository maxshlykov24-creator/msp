<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ЛУКДЕКОР · Сборка</title>
<style>
:root{font-family:"Avenir Next","Segoe UI",sans-serif;color:#1b1914;background:#efece4;--paper:#f7f4ee;--line:#ddd6c8;--muted:#6d675c;--accent:#1e4d38;--danger:#8d1f1f;--ok:#e5f2ea}
*{box-sizing:border-box}
body{margin:0;background:#efece4;color:#1b1914}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
header{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;padding:22px 22px 8px}
h1{font-size:28px;margin:0;letter-spacing:-.03em}
.role{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.who{color:var(--muted);font-size:14px}
main{max-width:980px;margin:0 auto;padding:8px 22px 72px}
.quiet{color:var(--muted);font-size:13px;line-height:1.45}
.foot{margin-top:28px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:22px}
label{display:block;margin:14px 0;font-size:14px;color:var(--muted)}
input,select{display:block;width:100%;margin-top:6px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px;font-size:18px}
button.primary{background:var(--accent);color:#fff;border:0;border-radius:14px;padding:16px 18px;font-size:18px;width:100%}
button.texty{background:transparent;border:0;color:var(--muted);padding:14px 0;font-size:16px;width:100%}
.login{max-width:440px;margin:48px auto}
.queues{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}
.queues button{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 10px;text-align:left}
.queues button.on{border-color:var(--accent);background:#e7f0eb}
.queues b{display:block;font-size:32px;letter-spacing:-.04em}
.queues span{color:var(--muted);font-size:13px}
.list{display:grid;gap:10px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px}
.card b{font-size:18px}
.row{display:flex;gap:10px;align-items:center}
.step{min-height:62vh;display:flex;flex-direction:column;justify-content:center}
.article{font-size:64px;line-height:.95;letter-spacing:-.04em;margin:8px 0}
.name{font-size:28px;margin:0 0 8px}
.meta{font-size:20px;color:var(--muted)}
.progress{font-size:18px}
.scan{font-size:28px;padding:18px;border-radius:16px}
.veil{display:none;position:fixed;inset:0;background:var(--danger);color:#fff;z-index:5;padding:28px;text-align:center;place-items:center}
.veil.show{display:grid}
.veil button{background:#fff;color:var(--danger);border:0;border-radius:14px;padding:16px 22px;font-size:20px;margin-top:18px}
body.flash main{animation:ok .45s}
@keyframes ok{from{background:var(--ok)}to{background:transparent}}
.hidden{display:none!important}
.articles{display:grid;gap:8px;margin:12px 0}
.articles button{text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px}
.articles button.on{border-color:var(--accent);background:#e7f0eb}
@media(max-width:800px){
  header,main{padding-left:16px;padding-right:16px}
  .queues{grid-template-columns:1fr 1fr}
  .article{font-size:48px}
  h1{font-size:24px}
}
</style>
<header>
  <div>
    <div class="role" id="roleLine">ЛУКДЕКОР</div>
    <h1 id="title">Сборка</h1>
  </div>
  <div class="who" id="who"></div>
</header>
<main>
  <section id="login" class="panel login">
    <h2>Вход</h2>
    <form id="loginForm">
      <label>Имя<input name="employee" required autocomplete="name"></label>
      <label>Роль
        <select name="role">
          <option value="shift">Смена</option>
          <option value="picker">Сборщик</option>
          <option value="station">Станция</option>
        </select>
      </label>
      <label id="stationLabel">Станция<input name="station" value="Станция 1"></label>
      <button class="primary">Войти</button>
    </form>
  </section>
  <section id="app" class="hidden"></section>
  <p class="quiet foot">Показ на заданиях МойСклад. Короб условный. Файл стикера ещё не значит, что принтер напечатал. Отгрузку не делаем.</p>
</main>
<div class="veil" id="veil"><div><div id="veilText"></div><button type="button" id="veilOk">Понятно</button></div></div>
<script>
let state = null, queue = 'new', chosen = new Set(), lastPdf = '';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid = () => crypto.randomUUID();
function when(seconds){
  if (!seconds) return 'ещё не обновляли';
  return new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',timeZone:'Europe/Moscow'}).format(new Date(seconds*1000)).replace(' г.','');
}
function roleName(role){return {shift:'Смена',picker:'Сборщик',station:'Станция'}[role] || 'Сборка'}
async function api(path, body){
  const r = await fetch('/api/'+path, body === undefined ? {} : {method:'POST',headers:{'Content-Type':'application/json','X-Demo-Action':'1'},body:JSON.stringify(body)});
  const d = await r.json().catch(()=>({error:'Ответ не разобран'}));
  if (!r.ok) {
    const detail = Array.isArray(d.detail) ? d.detail.map(x => x.msg).filter(Boolean).join('. ') : d.detail;
    throw Error(d.error || detail || 'Ошибка запроса');
  }
  return d;
}
function fail(text){$('veilText').textContent = text; $('veil').classList.add('show')}
function flash(){document.body.classList.add('flash'); setTimeout(()=>document.body.classList.remove('flash'), 450)}
$('veilOk').onclick = () => {$('veil').classList.remove('show'); const scan = document.querySelector('.scan'); if (scan) scan.focus()};
$('loginForm').role.onchange = () => $('stationLabel').classList.toggle('hidden', $('loginForm').role.value !== 'station');
$('loginForm').role.onchange();
$('loginForm').onsubmit = async e => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target));
  if (data.role !== 'station') data.station = data.role === 'picker' ? 'Отбор' : 'Смена';
  try { await api('login', data); await load(); } catch (err) { fail(err.message) }
};
async function load(){
  state = await api('state');
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('roleLine').textContent = 'ЛУКДЕКОР · ' + roleName(state.actor.role);
  $('title').textContent = roleName(state.actor.role);
  $('who').innerHTML = esc(state.actor.employee) + '<br><button class="texty" id="logout" type="button">Выйти</button>';
  $('logout').onclick = async () => { await api('logout', {}); state = null; $('app').classList.add('hidden'); $('login').classList.remove('hidden'); $('who').textContent = ''; $('title').textContent = 'Сборка'; $('roleLine').textContent = 'ЛУКДЕКОР'; };
  draw();
}
function draw(){
  const role = state.actor.role;
  $('app').innerHTML = role === 'picker' ? picker() : role === 'station' ? station() : shift();
  bind();
  const scan = document.querySelector('.scan');
  if (scan) scan.focus();
}
function orders(){return state.orders || []}
function problem(o){return o.state === 'shortage' || o.state === 'return_pending' || (o.state === 'printing' && !o.sticker_ok)}
function shift(){
  const all = orders();
  const counts = {
    new: all.filter(o => !o.wave).length,
    pick: all.filter(o => o.state === 'picking').length,
    station: all.filter(o => ['picked','printing','packed'].includes(o.state)).length,
    fix: all.filter(problem).length
  };
  const buttons = [['new','К сборке'],['pick','В отборе'],['station','На станции']];
  if (counts.fix) buttons.push(['fix','Разобрать']);
  if (!buttons.some(([id]) => id === queue)) queue = 'new';
  const ekb = state.ekb_skipped ? `<p class="quiet">Екатеринбург: ${state.ekb_skipped}, не в пилоте.</p>` : '';
  return `<p class="quiet">МойСклад, обновлено ${esc(when(state.updated))}. Выборка ограничена, это не весь склад. <button class="texty" id="refresh" type="button" style="width:auto">Обновить</button></p>${ekb}
  <div class="queues">${buttons.map(([id,name]) => `<button type="button" data-queue="${id}" class="${queue===id?'on':''}"><b>${counts[id] || 0}</b><span>${name}</span></button>`).join('')}</div>
  ${queue==='new' ? waveForm() : listFor(queue)}`;
}
function waveForm(){
  const groups = new Map();
  for (const o of orders().filter(o => !o.wave)){
    const g = groups.get(o.article) || {article:o.article, name:o.product, ids:[]};
    g.ids.push(o.id); groups.set(o.article, g);
  }
  const cards = [...groups.values()].map(g => `<button type="button" data-article="${esc(g.article)}" class="${chosen.has(g.article)?'on':''}"><b>${esc(g.article)}</b><br>${g.ids.length} шт. ${esc(g.name === g.article ? '' : g.name)}</button>`).join('');
  return `<section class="panel"><h2>Взять волну</h2><p class="quiet">Склад ФБС. В волну входит не больше 20 заданий этой выборки. Назначь сборщика, как он войдёт.</p>
  <div class="articles">${cards || '<p class="quiet">Свободных заданий нет.</p>'}</div>
  <label>Тележка<input id="cart" placeholder="Скан тележки"></label>
  <label>Сборщик<input id="picker" placeholder="Имя сборщика"></label>
  <button class="primary" id="create" type="button">Начать волну</button></section>`;
}
function listFor(name){
  const rows = orders().filter(o => name==='pick' ? o.state==='picking' : name==='station' ? ['picked','printing','packed'].includes(o.state) : problem(o));
  if (!rows.length) return '<p class="quiet">Здесь пусто.</p>';
  return `<div class="list">${rows.map(card).join('')}</div>`;
}
function card(o){
  const wave = state.waves.find(w => w.id === o.wave);
  let extra = '';
  if (o.state === 'shortage') extra = `<div class="row"><button class="primary" type="button" data-found="${esc(o.id)}">Товар найден</button><button class="texty" type="button" data-missing="${esc(o.id)}">Не найден</button></div><label>Причина<input data-reason="${esc(o.id)}" placeholder="Если не найден"></label>`;
  if (o.state === 'return_pending') extra = `<label>Товар<input data-return-code="${esc(o.id)}"></label><label>Куда вернуть<input data-return-cell="${esc(o.id)}"></label><button class="primary" type="button" data-return="${esc(o.id)}">Возврат подтверждён</button>`;
  if (o.state === 'printing' && !o.sticker_ok) extra = `<label>Другая станция<input data-move="${esc(o.id)}" placeholder="Станция 2"></label><button class="texty" type="button" data-transfer="${esc(o.id)}">Передать</button>`;
  const look = [o.brand, o.color].filter(Boolean).join(', ');
  return `<article class="card"><b>${esc(o.article || 'Без артикула')}</b> ${esc(o.product && o.product !== o.article ? o.product : '')}<br><span class="quiet">${esc(look)} ${wave ? 'Волна '+wave.num : 'ещё не в волне'} · ${esc(o.number)}</span>${o.note ? `<div class="quiet">${esc(o.note)}</div>`:''}${extra}</article>`;
}
function picker(){
  const waves = state.waves.filter(w => w.employee === state.actor.employee);
  const free = state.waves.filter(w => !w.employee);
  if (!waves.length) return `<section class="step"><h2>Волна не назначена</h2><p class="quiet">Смена называет ваше имя при создании волны.</p>${free.map(w => `<button class="primary" type="button" data-claim="${esc(w.id)}">Взять волну ${w.num}</button>`).join('')}</section>`;
  const wave = waves[0];
  const mine = orders().filter(o => o.wave === wave.id && o.state === 'picking').sort((a,b) => String(a.moment||'').localeCompare(String(b.moment||'')) || a.id.localeCompare(b.id));
  const done = orders().filter(o => o.wave === wave.id && o.state !== 'picking').length;
  const total = orders().filter(o => o.wave === wave.id).length;
  if (!mine.length) return `<section class="step"><p class="progress">Волна ${wave.num}. ${done} из ${total}</p><h2>Отбор закончен</h2></section>`;
  const cur = mine[0];
  const left = mine.filter(o => o.product_id === cur.product_id).length;
  const look = [cur.brand, cur.color].filter(Boolean).join(', ');
  const title = cur.product && cur.product !== cur.article ? cur.product : '';
  return `<section class="step" data-job="${esc(cur.id)}" data-wave="${esc(wave.id)}"><p class="progress">Волна ${wave.num}, ${done} из ${total}</p><div class="article">${esc(cur.article || 'Без артикула')}</div><p class="name">${esc(title)}</p><p class="meta">${esc(look)}${look ? '. ' : ''}Ещё ${left} шт. этого артикула</p><input class="scan" id="scan" placeholder="Скан товара" autocomplete="off"><button class="texty" id="missing" type="button">Нет на месте</button></section>`;
}
function station(){
  if (!state.accepted_wave) return `<section class="step"><h2>Сканируйте тележку</h2><input class="scan" id="cartScan" placeholder="Тележка" autocomplete="off"></section>`;
  const wave = state.waves.find(w => w.id === state.accepted_wave) || state.waves[0];
  const mine = orders().filter(o => o.station === state.actor.station && o.state === 'printing');
  const open = mine[0];
  if (open && !open.sticker_ok) return `<section class="step" data-step="sticker" data-job="${esc(open.id)}" data-wave="${esc(open.wave)}"><p class="progress">${esc(wave ? wave.box_label : 'Короб')}</p><h2>Стикер</h2><p class="meta">${esc(open.article)} ${esc(open.number)}</p><a id="print" href="/api/label/${esc(open.id)}" target="_blank" rel="noopener">Печать</a><input class="scan" id="scan" placeholder="Скан стикера" autocomplete="off"><p class="quiet">Открытие файла ещё не значит, что принтер напечатал.</p></section>`;
  if (open && open.sticker_ok) return `<section class="step" data-step="box" data-job="${esc(open.id)}"><p class="article">${esc(open.box_label || 'Короб')}</p><p class="meta">Код ${esc(open.box)}. Короб условный.</p><input class="scan" id="scan" placeholder="Скан короба" autocomplete="off"></section>`;
  return `<section class="step" data-step="item" data-wave="${esc(state.accepted_wave)}"><h2>Сканируйте товар</h2><input class="scan" id="scan" placeholder="Скан товара" autocomplete="off"></section>`;
}
function bind(){
  document.querySelectorAll('[data-queue]').forEach(b => b.onclick = () => { queue = b.dataset.queue; draw(); });
  document.querySelectorAll('[data-article]').forEach(b => b.onclick = () => { const id = b.dataset.article; chosen.has(id) ? chosen.delete(id) : chosen.add(id); draw(); });
  const refresh = $('refresh');
  if (refresh) refresh.onclick = () => run(async () => { await api('refresh', {}); await load(); flash(); });
  const create = $('create');
  if (create) create.onclick = () => run(async () => {
    const ids = [];
    for (const o of orders().filter(o => !o.wave && chosen.has(o.article))) { if (ids.length >= 20) break; ids.push(o.id); }
    const r = await api('wave', {ids, cart: $('cart').value, picker: $('picker').value});
    chosen.clear(); await load(); flash();
    return r;
  });
  document.querySelectorAll('[data-found]').forEach(b => b.onclick = () => run(() => api('resolve', {job:b.dataset.found, decision:'found', request_id:rid()}).then(load).then(flash)));
  document.querySelectorAll('[data-missing]').forEach(b => b.onclick = () => run(() => api('resolve', {job:b.dataset.missing, decision:'missing', reason:(document.querySelector(`[data-reason="${b.dataset.missing}"]`)||{}).value || '', request_id:rid()}).then(load)));
  document.querySelectorAll('[data-return]').forEach(b => b.onclick = () => run(() => api('action', {job:b.dataset.return, action:'return', code:(document.querySelector(`[data-return-code="${b.dataset.return}"]`)||{}).value || '', target:(document.querySelector(`[data-return-cell="${b.dataset.return}"]`)||{}).value || '', request_id:rid()}).then(load).then(flash)));
  document.querySelectorAll('[data-transfer]').forEach(b => b.onclick = () => run(() => api('action', {job:b.dataset.transfer, action:'transfer', target:(document.querySelector(`[data-move="${b.dataset.transfer}"]`)||{}).value || '', request_id:rid()}).then(load)));
  document.querySelectorAll('[data-claim]').forEach(b => b.onclick = () => run(() => api('claim', {wave:b.dataset.claim, request_id:rid()}).then(load)));
  const missing = $('missing');
  if (missing) missing.onclick = () => run(async () => { await api('action', {job:$('app').querySelector('[data-job]').dataset.job, action:'shortage', request_id:rid()}); await load(); });
  const scan = $('scan');
  if (scan) scan.onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); submitScan(scan.value.trim()); } };
  const cartScan = $('cartScan');
  if (cartScan) cartScan.onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); run(() => api('accept-cart', {cart:cartScan.value.trim(), request_id:rid()}).then(load).then(flash)); } };
}
async function submitScan(code){
  const root = $('app').querySelector('[data-wave],[data-job]');
  const role = state.actor.role;
  const request_id = rid();
  await run(async () => {
    if (role === 'picker') await api('pick-scan', {wave:root.dataset.wave, code, request_id});
    else if (root.dataset.step === 'sticker') await api('action', {job:root.dataset.job, action:'sticker', code, request_id});
    else if (root.dataset.step === 'box') await api('action', {job:root.dataset.job, action:'box', code, request_id});
    else await api('station-scan', {wave:root.dataset.wave, code, request_id});
    await load(); flash();
  });
}
let busy = false;
async function run(fn){
  if (busy) return;
  busy = true;
  try { await fn(); }
  catch (err) { fail(err.message); try { await load(); } catch {} }
  finally { busy = false; const scan = document.querySelector('.scan'); if (scan && !$('veil').classList.contains('show')) scan.focus(); }
}
load().catch(() => {});
</script>
</html>
