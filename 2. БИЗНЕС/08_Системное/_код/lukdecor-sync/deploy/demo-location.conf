# Include in HTTPS server for ms-p.ru on the ingress host only.
location = /lukdecor { return 302 /lukdecor/; }
location ^~ /lukdecor/ {
    alias /opt/ms-p-lukdecor-demo/;
    index index.html;
    auth_basic "LUKDECOR demo";
    auth_basic_user_file /etc/nginx/lukdecor-demo.htpasswd;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; frame-ancestors 'none'; form-action 'none'; base-uri 'none'" always;
}
