# Telegram Mini App и iframe сайта (Tilda). Слушает localhost, снаружи не открыт.
# Публичные 80/443 (sslip.io, вебхуки YCLIENTS) не трогает.
server {
    listen 127.0.0.1:8088;
    server_name _;
    root /var/www/keris;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8091/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8091/health;
        add_header Access-Control-Allow-Origin * always;
    }

    location /media/ {
        alias /var/lib/keris/photos/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /webhooks/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, must-revalidate";
    }
}
