# vhost для divomotors-analytics.ru → FastAPI на 127.0.0.1:19100
# Плейсхолдер __FQDN__ заменяется скриптом deploy/nginx-domain.sh.
# certbot потом сам допишет 443-блок и редирект.

limit_req_zone $binary_remote_addr zone=divo_login:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name __FQDN__;

    # тело загрузок небольшое, аналитика только читает
    client_max_body_size 2m;

    # gzip для статики/JSON
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;
    gzip_min_length 1024;

    # базовые security-заголовки
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /login {
        limit_req zone=divo_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:19100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:19100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
