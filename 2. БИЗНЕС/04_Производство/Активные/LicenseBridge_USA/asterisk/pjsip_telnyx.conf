;
; Telnyx SIP-транк (облачная замена GSM-шлюза TG400).
; Подключается из /etc/asterisk/pjsip.conf строкой:
;   #include "pjsip_telnyx.conf"
;
; Логин/пароль Credential Connection лежат только на сервере в
; /etc/asterisk/pjsip_telnyx_auth.conf (секция [telnyx_auth]) — в репозитории их нет.
;
; Регион US: sip.telnyx.com → 192.76.120.10 / 64.16.250.10 (sip.telnyx.com/#signaling).
;
#include "pjsip_telnyx_auth.conf"

[telnyx_reg]
type=registration
transport=transport-udp
outbound_auth=telnyx_auth
server_uri=sip:sip.telnyx.com
client_uri=sip:usersales96253@sip.telnyx.com
contact_user=usersales96253
expiration=600
retry_interval=30
forbidden_retry_interval=300
fatal_retry_interval=60
max_retries=0
; line/endpoint: входящий по этой регистрации сразу сопоставляется с [telnyx],
; даже если Telnyx придёт с адреса, которого нет в [telnyx_identify]
line=yes
endpoint=telnyx

[telnyx]
type=aor
contact=sip:sip.telnyx.com
qualify_frequency=60
qualify_timeout=3.0

[telnyx]
type=endpoint
context=from-telnyx
transport=transport-udp
outbound_auth=telnyx_auth
aors=telnyx
from_domain=sip.telnyx.com
disallow=all
allow=ulaw
allow=alaw
dtmf_mode=rfc4733
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
; CallerID исходящего = наш DID, Telnyx принимает его в From.
; callerid здесь — запасной вариант для служебных вызовов (originate из CLI):
; диалплан ставит свой DID на каждого менеджера и перекрывает это значение.
callerid=LicenseBridge <+18187911783>
trust_id_inbound=yes
send_rpid=yes
timers=yes
language=en

[telnyx_identify]
type=identify
endpoint=telnyx
match=192.76.120.10
match=64.16.250.10
