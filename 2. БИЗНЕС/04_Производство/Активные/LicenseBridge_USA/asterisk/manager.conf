;
; AMI — единственный внешний вход в Asterisk, нужен хабу ровно для одной команды:
; Originate AI-звонка (tilda-webhook/app/ami.py). Ничего больше через AMI не идёт.
;
; Пароль и разрешённый IP лежат на сервере в manager_lb_local.conf (не в
; репозитории, chmod 640, владелец root:asterisk) — как LB_KEY у диалплана:
;
;   [lbhub]
;   secret = <пароль, он же AMI_SECRET в .env хаба>
;   deny = 0.0.0.0/0.0.0.0
;   permit = 72.56.123.137/255.255.255.255
;   read = system,call
;   write = originate
;
; Порт 5038 закрыт файрволом для всех, кроме хаба:
;   ufw allow from 72.56.123.137 to any port 5038 proto tcp
;
[general]
enabled = yes
port = 5038
bindaddr = 0.0.0.0
displayconnects = no
; AMI шумит событиями на каждый канал; хабу они не нужны, а трафик и CPU экономят
allowmultiplelogin = no
timestampevents = no

#include "manager_lb_local.conf"
