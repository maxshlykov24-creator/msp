;
; LicenseBridge — диалплан Asterisk 20 (159.65.97.156)
;
; Входящий: линия TG400 → меню «1 продажи / 2 обслуживание» → параллельный
; дозвон всем из LB_ORDER (хаб) → если никто не ответил, хаб ставит
; задачу ответственному в Kommo. Итог каждого звонка (запись, длительность)
; уходит в хаб из hangup-handler'а.
;
; Роли: 102 Полина (SIM2, обслуживание), 103 Александра (SIM3, продажи и РОП).
; 101 — Павел (с 24.08.2026, был добавочный Илоны). С 31.08 входящие продажи
; звонят 101 и 103 сразу: кто в сети — слышит гудки, офлайн-софтфон Dial
; пропускает мгновенно. График смен больше не нужен.
; Исходящие идут через один SIP-транк tg400trunk с техническим префиксом
; 1/2/3. TG400 снимает префикс и выбирает соответствующую физическую SIM.
; Это исключает ошибку старой схемы, где вызовы от разных SIP-транков
; фактически попадали в Trunk1 и создавали ложный «лимит одного звонка».
; Источник правды — этот файл в репозитории; на сервер кладёт deploy.sh.
;
[general]
static=yes
writeprotect=no

[globals]
RECORDING_DIR=/var/spool/asterisk/monitor
; LB_HUB и LB_KEY лежат в extensions_lb_local.conf (не в репозитории)
#include "extensions_lb_local.conf"
LB_ORDER_FALLBACK=103-101        ; хаб недоступен → оба сразу: Александра и Павел
LB_CLIENT_RING=25                ; сколько ждём ответа у Полины (102)
LB_RING_EACH=12                  ; устарело: карусель снята 31.08, переменная не читается
LB_RING_LAST=35                  ; параллельный вызов всем в LB_ORDER
; минимальная длительность гудков после выбора в меню. Если менеджеры offline,
; Dial возвращает CHANUNAVAIL мгновенно, и клиент слышит 2-3 гудка — снаружи это
; выглядит как поломка линии. Недостающее добираем Playtones(ring) в padring,
; чтобы дозвон всегда звучал как обычный неотвеченный звонок.
LB_MIN_RING=35
; 6 сек было мало: по логам реальных звонков абонент жмёт клавишу через 8-10 сек
; после конца фразы (мобильная связь + реакция), DTMF прилетал уже после того как
; диалплан ушёл в продажи по умолчанию (тот же сценарий, что и явная «1»).
; Нажатие ВО ВРЕМЯ проигрыша фразы уже работает само по себе: Background()
; прерывается любой цифрой, которая совпадает с добавочным в контексте (1/2),
; и уходит туда мгновенно, не дожидаясь конца файла — это встроенное поведение
; Asterisk, отдельно настраивать не нужно.
LB_MENU_GAP=8                    ; пауза между повторами меню (короче — быстрее повтор записи)
LB_MENU_WAIT=20                  ; после последнего проигрыша — дольше ждём перед уходом в продажи
LB_MENU_REPEATS=2                ; сколько раз проиграть меню, если молчание (доп. запас времени)
LB_TECH=PJSIP                    ; подменяется в [lb-test] на Local для прогонов
LB_SUFFIX=
; ── исходящий транк ──
; telnyx — облачный SIP (основной с 31.07.2026), tg400 — старый GSM-шлюз.
; Переключение линии целиком делается этим глобалом + dialplan reload.
LB_OUT_TRUNK=telnyx
; CallerID исходящего: DID Telnyx у каждого менеджера свой, клиент видит тот же
; номер, по которому ему звонили и на который он может перезвонить.
LB_TELNYX_DID_101=+18187911783
LB_TELNYX_DID_102=+18188066005
LB_TELNYX_DID_103=+18188066735
; Подмена CallerID для конкретного добавочного: регистрация в MicroSIP остаётся
; своя, клиент видит другой наш номер. С 20.08.2026 Александра (103) звонит с
; номера Полины +18188066005 — её собственный 6735 нужно отдохнуть от метки.
; Снять подмену без правки файла:
;   asterisk -rx 'dialplan set global LB_OUT_CID_103 '
LB_OUT_CID_103=+18188066005
; Часы работы отключены с 13.08.2026: при LB_AI_ON=0 ветка afterhours снимала
; трубку и молча клала её через секунду, и вечерние звонки выглядели для клиента
; как «взяли и сбросили» (12.08 так ушли три номера, в том числе в 18:04 — через
; четыре минуты после закрытия). Круглосуточно: меню, менеджеры, задача при
; недозвоне. LB_HOURS_ENABLED=1 вернёт окно ниже.
LB_HOURS_ENABLED=0
LB_HOURS=09:00-18:00
LB_DAYS=mon-fri
LB_TZ=America/New_York
; ── голосовой агент Pleep (SIP-транкинг ElevenLabs, см. pjsip_pleep.conf) ──
; К агенту звоним через [pleep_out]: INVITE на sip.rtc.elevenlabs.io с
; идентификатором LB_PLEEP_NUMBER в URI — это «Номер телефона», под которым
; агент импортирован в Pleep/ElevenLabs, а не публичный номер для звонка
; извне (старый +16464256862 отвязан, сейчас это DID линии 103).
LB_PLEEP_SIP=1                   ; 0 — не пробовать sip.rtc.elevenlabs.io, сразу Telnyx-резерв
LB_PLEEP_NUMBER=+18188066735
LB_PLEEP_CID=+18188066735        ; DID, закреплённый за агентом (линия 3)
; Входящий на DID агента ведём сразу к нему, минуя меню и менеджеров.
; По умолчанию 0 — линия 3 принадлежит людям. С 13.08 агент рвёт разговор на
; 1.5-й секунде приветствия (BYE от ElevenLabs без причины, см. README), и живые
; клиенты на этом номере теряются. Включать только на время проверки:
;   asterisk -rx 'dialplan set global LB_PLEEP_DID3 1'
; Безопасный дефолт здесь означает, что перезапуск Asterisk и `dialplan reload`
; сами возвращают звонки Александре, даже если рубильник забыли выключить.
LB_PLEEP_DID3=0
LB_AI_RING=45                    ; сколько ждём ответа клиента и самого агента
LB_AI_CID=+18187911783           ; DID, с которого агент звонит клиенту (линия 1)
; рубильник без правки файла (агент замолчал, счёт кончился и т.п.):
;   asterisk -rx 'dialplan set global LB_AI_ON 0'   ; входящие снова просто сбрасываются
;   asterisk -rx 'dialplan set global LB_AI_ON 1'
LB_AI_ON=0
; Временно: входящий на +18188066735 (DID 3 / 103) без меню — сразу дозвон на 103.
; Включается/выключается без правок файла:
;   asterisk -rx 'dialplan set global LB_DIRECT_103 1'   ; меню выкл
;   asterisk -rx 'dialplan set global LB_DIRECT_103 0'   ; меню обратно
LB_DIRECT_103=0

; ── входящие с линий TG400 ──
; CallerID и набранный номер у GSM-шлюза приходят по-разному (бывает пусто и
; extension=s), поэтому ловим и шаблон, и s, и i.
[from-trunk]
; В единой схеме TG400 передаёт Hotline 1001/1002/1003 через один SIP-транк.
; Последняя цифра сохраняет номер физической SIM для хаба/Kommo.
exten => _100[1-3],1,Set(LB_DID=${EXTEN:3:1})
 same => n,Goto(lb-inbound,start,1)
exten => _.,1,Set(LB_DID=1)
 same => n,Goto(lb-inbound,start,1)
exten => s,1,Set(LB_DID=1)
 same => n,Goto(lb-inbound,start,1)
exten => i,1,Set(LB_DID=1)
 same => n,Goto(lb-inbound,start,1)

[from-trunk2]
exten => _.,1,Set(LB_DID=2)
 same => n,Goto(lb-inbound,start,1)
exten => s,1,Set(LB_DID=2)
 same => n,Goto(lb-inbound,start,1)
exten => i,1,Set(LB_DID=2)
 same => n,Goto(lb-inbound,start,1)

[from-trunk3]
exten => _.,1,Set(LB_DID=3)
 same => n,Goto(lb-inbound,start,1)
exten => s,1,Set(LB_DID=3)
 same => n,Goto(lb-inbound,start,1)
exten => i,1,Set(LB_DID=3)
 same => n,Goto(lb-inbound,start,1)

; ── входящие с облачного транка Telnyx ──
; Telnyx кладёт наш DID в Request-URI (обычно в E.164 с «+», но бывает и без).
; Линию определяем по последним 4 цифрам, дальше — тот же сценарий, что у TG400:
; LB_DID 1/2/3 хаб уже понимает (Илона / обслуживание / третья линия).
[from-telnyx]
exten => _+1NXXNXXXXXX,1,Set(LB_TO4=${EXTEN:-4})
 same => n,Goto(sel,1)
exten => _1NXXNXXXXXX,1,Set(LB_TO4=${EXTEN:-4})
 same => n,Goto(sel,1)
exten => _NXXNXXXXXX,1,Set(LB_TO4=${EXTEN:-4})
 same => n,Goto(sel,1)
exten => s,1,Set(LB_TO4=1783)
 same => n,Goto(sel,1)
exten => i,1,Set(LB_TO4=1783)
 same => n,Goto(sel,1)
; sel — петля самопроверки: звонок 8871 из [lb-test] уходит на наш же DID и
; возвращается снаружи. Такой звонок отвечает тестовый ответчик, менеджеров он
; не трогает и в Kommo ничего не создаёт. Включается на время проверки:
;   asterisk -rx 'dialplan set global LB_SELFTEST 1'   (после теста — 0)
exten => sel,1,GotoIf($["${LB_SELFTEST}"="1" & "${CALLERID(num)}"="${LB_TELNYX_DID_101}"]?lb-telnyx-loop,s,1)
 same => n,Goto(did,${LB_TO4},1)

[did]
exten => 1783,1,Set(LB_DID=1)
 same => n,Goto(lb-inbound,start,1)
exten => 6005,1,Set(LB_DID=2)
 same => n,Goto(lb-inbound,start,1)
exten => 6735,1,Set(LB_DID=3)
; pleep_out — статический транк на sip.rtc.elevenlabs.io, а не регистрация,
; поэтому "доступен ли агент" тут не проверяем девайс-стейтом — только рубильники
 same => n,GotoIf($["${LB_PLEEP_DID3}"="1" & "${LB_PLEEP_SIP}"="1"]?lb-did3-ai,start,1)
 same => n,GotoIf($["${LB_DIRECT_103}"="1"]?lb-direct-103,start,1)
 same => n,Goto(lb-inbound,start,1)
; неизвестный номер на нашем аккаунте — не терять звонок, вести как линию 1
exten => _X.,1,NoOp(LB unknown DID ${EXTEN})
 same => n,Set(LB_DID=1)
 same => n,Goto(lb-inbound,start,1)

; ── DID агента: звонок сразу к Pleep ──
; Меню и менеджеров не трогаем: этот номер закреплён за агентом. LB_TRIED=1 —
; чтобы хаб не считал разговор пропущенным и не ставил задачу «перезвонить».
[lb-did3-ai]
exten => start,1,NoOp(LB DID3 -> pleep cid=${CALLERID(num)} uid=${UNIQUEID})
 same => n,Set(LB_DIRECTION=in)
 same => n,Set(LB_PHONE=${CALLERID(num)})
 same => n,Set(LB_TRIED=1)
 same => n,Set(CHANNEL(hangup_handler_push)=lb-hangup,s,1)
 same => n,Answer()
 same => n,Set(LB_REC=${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-ai-${UNIQUEID})
 same => n,MixMonitor(${RECORDING_DIR}/${LB_REC}.wav,b)
 same => n,Wait(1)
 same => n,Goto(lb-ai-pleep,s,1)

; ── временный прямой дозвон на 103 (верификация / без меню) ──
; Только DID +18188066735. Остальные линии и меню не трогает.
[lb-direct-103]
exten => start,1,NoOp(LB DIRECT 103 cid=${CALLERID(num)} uid=${UNIQUEID})
 same => n,Dial(PJSIP/103,60,r)
 same => n,Hangup()

; ── общий сценарий входящего ──
[lb-inbound]
exten => start,1,NoOp(LB IN did=${LB_DID} cid=${CALLERID(num)} exten=${EXTEN} uid=${UNIQUEID})
 same => n,Set(LB_DIRECTION=in)
 ; номер отдаём хабу как есть: у международного звонка «+» несёт смысл,
 ; поэтому не режем цифрами, а кодируем URIENCODE для тела POST
 same => n,Set(LB_PHONE=${CALLERID(num)})
 same => n,Set(LB_TRIED=0)
 same => n,Set(CHANNEL(hangup_handler_push)=lb-hangup,s,1)
 ; порядок дозвона спрашиваем ДО ответа: клиент в это время слышит гудки
 same => n,Set(CURLOPT(conntimeout)=2)
 same => n,Set(CURLOPT(httptimeout)=5)
 same => n,Set(LB_ORDER=${CURL(${LB_HUB}/internal/call/route,key=${LB_KEY}&did=${LB_DID}&phone=${URIENCODE(${LB_PHONE})})})
 same => n,ExecIf($["${LB_ORDER}"=""]?Set(LB_ORDER=${LB_ORDER_FALLBACK}))
 same => n,NoOp(LB order=${LB_ORDER})
 same => n,GotoIf($["${LB_HOURS_ENABLED}"="1"]?checktime:menu)
 same => n(checktime),GotoIfTime(${LB_HOURS},${LB_DAYS},*,*,${LB_TZ}?menu:afterhours)

 same => n(menu),Answer()
 same => n,Set(LB_REC=${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-in-${UNIQUEID})
 same => n,MixMonitor(${RECORDING_DIR}/${LB_REC}.wav,b)
 ; уровень записи не поднимаем здесь: пики в реальных разговорах уже около 0 dBFS,
 ; усиление дало бы клиппинг. Громкость выравнивает loudnorm при кодировании в mp3.
 same => n,Set(VOLUME(TX)=-6)
 same => n,Set(VOLUME(RX)=-6)
 same => n,Wait(1)
 same => n,Set(LB_MENU_TRY=0)
 ; проигрываем меню и ждём цифру; между повторами — короткая пауза (LB_MENU_GAP),
 ; после последнего круга — длинная (LB_MENU_WAIT), затем продажи по умолчанию
 same => n(playmenu),Background(custom/lb-menu)
 same => n,Set(LB_MENU_TRY=$[${LB_MENU_TRY} + 1])
 same => n,GotoIf($[${LB_MENU_TRY} < ${LB_MENU_REPEATS}]?gap:lastwait)
 same => n(gap),WaitExten(${LB_MENU_GAP})
 same => n,Goto(playmenu)
 same => n(lastwait),WaitExten(${LB_MENU_WAIT})
 same => n,Goto(sales,1)

 ; вне часов работы: разговор ведёт голосовой агент, а не автоответчик
 same => n(afterhours),Answer()
 same => n,Set(LB_TRIED=1)
 same => n,GotoIf($["${LB_AI_ON}"="0"]?ahdrop)
 same => n,Set(LB_REC=${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-ai-${UNIQUEID})
 same => n,MixMonitor(${RECORDING_DIR}/${LB_REC}.wav,b)
 same => n,Wait(1)
 same => n,Goto(lb-ai-pleep,s,1)
 same => n(ahdrop),Wait(1)
 same => n,Hangup()

; выбор клиента в меню
exten => 1,1,Goto(sales,1)
; «2» — обслуживание: звоним Полине напрямую на добавочный 102 (обычный SIP).
; Не взяла за LB_CLIENT_RING секунд —
; кладём трубку, хаб ставит задачу «перезвонить» на Полину (LB_BRANCH=service).
exten => 2,1,Set(LB_TRIED=1)
 same => n,Set(LB_BRANCH=service)
 same => n,Set(LB_RING_START=${EPOCH})
 ; LB_SERVICE_DIAL подменяется в [lb-test] для прогонов без телефона Полины
 same => n,GotoIf($["${LB_SERVICE_DIAL}"!=""]?dial)
 same => n,Set(LB_SERVICE_DIAL=PJSIP/102)
 ; канал уже Answer()'нут меню — без опции r абонент слышит тишину до ответа
 ; менеджера (softphone не отдаёт early media). r = гудки на линии до Answer.
 same => n(dial),Dial(${LB_SERVICE_DIAL},${LB_CLIENT_RING},r)
 same => n,NoOp(LB service status=${DIALSTATUS} sec=${ANSWEREDTIME})
 same => n,GotoIf($["${DIALSTATUS}"="ANSWER"]?done,1)
 ; софтфон 102 не зарегистрирован — Dial отваливается мгновенно, и клиент раньше
 ; слушал добор гудков и уходил в пропущенные. Отдаём его живым 101 и 103;
 ; ветка остаётся service, поэтому недозвон по-прежнему станет задачей Полине.
 same => n,GotoIf($["${DIALSTATUS}"="CHANUNAVAIL"]?sales,1)
 same => n,GotoIf($["${DIALSTATUS}"="CONGESTION"]?sales,1)
 ; не ответила — добираем гудки до LB_MIN_RING и только потом сброс
 same => n,Goto(padring,1)
exten => i,1,Goto(sales,1)
exten => t,1,Goto(sales,1)

; продажи: все из LB_ORDER звонят сразу. Согласовано с Павлом 31.08: не ждать
; график смен — кто закрыл MicroSIP, того Dial пропускает мгновенно, гудки идут
; тому, кто в сети. Кто снял трубку первым, того хаб подпишет автором в Kommo.
exten => sales,1,Set(LB_TRIED=1)
 same => n,Set(LB_RING_START=${EPOCH})
 same => n,Set(LB_N=1)
 same => n,Set(LB_PARALLEL=)
 same => n(build),Set(LB_EXT=${CUT(LB_ORDER,-,${LB_N})})
 same => n,GotoIf($["${LB_EXT}"=""]?dialall)
 same => n,GotoIf($[${LB_N} > 4]?dialall)
 same => n,GotoIf($["${LB_PARALLEL}"=""]?firstleg:nextleg)
 same => n(firstleg),Set(LB_PARALLEL=${LB_TECH}/${LB_EXT}${LB_SUFFIX})
 same => n,Goto(afterleg)
 same => n(nextleg),Set(LB_PARALLEL=${LB_PARALLEL}&${LB_TECH}/${LB_EXT}${LB_SUFFIX})
 same => n(afterleg),Set(LB_N=$[${LB_N} + 1])
 same => n,Goto(build)
 same => n(dialall),NoOp(LB ring parallel ${LB_PARALLEL})
 same => n,GotoIf($["${LB_PARALLEL}"=""]?padring,1)
 same => n,Dial(${LB_PARALLEL},${LB_RING_LAST},r)
 same => n,GotoIf($["${DIALSTATUS}"="ANSWER"]?done,1)
 same => n,Goto(padring,1)

; добор гудков: сколько бы Dial'ов ни отвалилось мгновенно (все offline) или по
; таймауту, клиент слышит непрерывный дозвон не меньше LB_MIN_RING секунд
exten => padring,1,Set(LB_RING_LEFT=$[${LB_MIN_RING} - (${EPOCH} - ${LB_RING_START})])
 same => n,NoOp(LB pad ring ${LB_RING_LEFT}s status=${DIALSTATUS})
 same => n,GotoIf($[${LB_RING_LEFT} > 0]?play:miss,1)
 same => n(play),Playtones(ring)
 same => n,Wait(${LB_RING_LEFT})
 same => n,StopPlaytones()
 same => n,Goto(miss,1)

; никто из менеджеров не взял трубку — вместо сброса передаём звонок агенту.
; Не дозвонились и до него (LB_AI_ON=0 или транк лёг) — обычный пропущенный:
; хаб поставит задачу «перезвонить», как и раньше.
exten => miss,1,NoOp(LB missed phone=${LB_PHONE} uid=${UNIQUEID})
 same => n,GotoIf($["${LB_AI_ON}"="0"]?hang)
 same => n,Goto(lb-ai-pleep,s,1)
 same => n(hang),Hangup()

; кто снял трубку: DIALEDPEERNAME приходит как PJSIP/103-00000064 (в тестах —
; Local/103@lb-answer-...), нужен только добавочный — его хаб превращает в
; пользователя Kommo и ставит автором примечания-звонка.
exten => done,1,Set(LB_EXT_NUM=${FILTER(0-9,${CUT(CUT(DIALEDPEERNAME,/,2),-,1)})})
 same => n,NoOp(LB answered phone=${LB_PHONE} sec=${ANSWEREDTIME} ext=${LB_EXT_NUM})
 same => n,Hangup()

; ── исходящие от менеджеров ──
; CallerID = добавочный, поэтому у каждого свой SIM-порт: клиент видит тот же
; номер, с которого ему звонили раньше.
[from-internal]
exten => _X.,1,Set(LB_NUM=${EXTEN})
 same => n,Goto(lb-outbound,start,1)
exten => _+.,1,Set(LB_NUM=${EXTEN:1})
 same => n,Goto(lb-outbound,start,1)

[lb-outbound]
exten => start,1,NoOp(LB OUT ${CALLERID(num)} -> ${LB_NUM} uid=${UNIQUEID})
 same => n,Set(LB_DIRECTION=out)
 same => n,Set(LB_PHONE=${LB_NUM})
 same => n,Set(LB_TRIED=0)
 same => n,Set(CHANNEL(hangup_handler_push)=lb-hangup,s,1)
 same => n,Set(LB_REC=${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-out-${UNIQUEID})
 same => n,MixMonitor(${RECORDING_DIR}/${LB_REC}.wav,b)
 same => n,Set(VOLUME(TX)=-6)
 same => n,Set(VOLUME(RX)=-6)
 ; добавочный запоминаем: CALLERID ниже подменяется на DID, а для фолбэка на
 ; TG400 и для автора примечания в Kommo нужен именно номер менеджера
 same => n,Set(LB_EXT_NUM=${CALLERID(num)})
 same => n,GotoIf($["${LB_OUT_TRUNK}"="telnyx"]?telnyx)
 same => n,Goto(tg400)

 ; ── облачный транк Telnyx (основной) ──
 ; Номер приводим к E.164: 10 цифр — местный US, добавляем 1; «+» ставим всегда.
 same => n(telnyx),Set(LB_E164=${FILTER(0-9,${LB_NUM})})
 same => n,ExecIf($[${LEN(${LB_E164})} = 10]?Set(LB_E164=1${LB_E164}))
 same => n,Set(LB_E164=+${LB_E164})
 same => n,Set(LB_CID=${LB_TELNYX_DID_101})
 same => n,ExecIf($["${LB_EXT_NUM}"="102"]?Set(LB_CID=${LB_TELNYX_DID_102}))
 same => n,ExecIf($["${LB_EXT_NUM}"="103"]?Set(LB_CID=${LB_TELNYX_DID_103}))
 ; подмена по добавочному, если задана: см. LB_OUT_CID_103 в [globals]
 same => n,ExecIf($["${LB_EXT_NUM}"="103" & "${LB_OUT_CID_103}"!=""]?Set(LB_CID=${LB_OUT_CID_103}))
 same => n,Set(CALLERID(num)=${LB_CID})
 same => n,Set(CALLERID(name)=${LB_CID})
 ; ── сторож дозвона ──
 ; Спрашиваем хаб, не нарушает ли набор антиспам-правила: мгновенный повтор,
 ; повтор раньше интервала, лимит попыток в сутки. Метку «спам» движки ставят
 ; именно за это поведение, поэтому нарушения надо видеть, а не узнавать от
 ; клиента. Ответ `ok` / `soft:<причина>` / `deny:<причина>`; режим задаёт хаб
 ; (DIAL_GUARD_MODE), по умолчанию warn — считаем, но звонок пропускаем.
 ; Хаб недоступен или молчит — набираем: репутация важна, но не важнее звонка.
 same => n,Set(CURLOPT(conntimeout)=2)
 same => n,Set(CURLOPT(httptimeout)=4)
 same => n,Set(LB_GUARD=${CURL(${LB_HUB}/internal/call/guard,key=${LB_KEY}&phone=${URIENCODE(${LB_E164})})})
 same => n,ExecIf($["${LB_GUARD}"=""]?Set(LB_GUARD=ok))
 same => n,NoOp(LB guard ${LB_E164} -> ${LB_GUARD})
 same => n,Set(CDR(userfield)=guard=${LB_GUARD})
 same => n,GotoIf($["${LB_GUARD:0:4}"="deny"]?guarded)
 same => n,NoOp(LB OUT via telnyx ${LB_E164} cid=${LB_CID})
 same => n,Dial(PJSIP/${LB_E164}@telnyx,60)
 same => n,NoOp(LB telnyx status=${DIALSTATUS})
 ; транк лежит / Telnyx отбил вызов до дозвона — уходим на GSM-шлюз, звонок не теряем
 same => n,GotoIf($["${DIALSTATUS}"="CHANUNAVAIL" | "${DIALSTATUS}"="CONGESTION"]?tg400)
 same => n,Hangup()

 ; ── GSM-шлюз TG400 (резерв) ──
 ; Один SIP-транк, первая техническая цифра выбирает SIM:
 ; 101 → 1 → Trunk1, 102 → 2 → Trunk2, 103 → 3 → Trunk3.
 same => n(tg400),Set(CALLERID(num)=${LB_EXT_NUM})
 same => n,Set(CALLERID(name)=${LB_EXT_NUM})
 same => n,GotoIf($["${LB_EXT_NUM}"="102"]?port2)
 same => n,GotoIf($["${LB_EXT_NUM}"="103"]?port3)
 same => n(port1),Dial(PJSIP/1${LB_NUM}@tg400trunk,60)
 same => n,Hangup()
 same => n(port2),Dial(PJSIP/2${LB_NUM}@tg400trunk,60)
 same => n,Hangup()
 same => n(port3),Dial(PJSIP/3${LB_NUM}@tg400trunk,60)
 same => n,Hangup()

 ; ── набор не разрешён сторожем (только режим block) ──
 ; Записи Павла 27.08: 15 мин / 3 часа / Reactivation / завтра / номер занят.
 ; Неизвестная причина → 15 мин, чтобы менеджер не слышал тишину.
 same => n(guarded),NoOp(LB OUT blocked by guard ${LB_GUARD})
 same => n,GotoIf($["${LB_GUARD}"="deny:attempt2_3h"]?play3h)
 same => n,GotoIf($["${LB_GUARD:0:16}"="deny:day_limit_"]?playday)
 same => n,GotoIf($["${LB_GUARD}"="deny:reactivation_24h"]?playtom)
 same => n,GotoIf($["${LB_GUARD}"="deny:cid_busy"]?playbusy)
 same => n,Playback(custom/lb-block-15min)
 same => n,Hangup()
 same => n(play3h),Playback(custom/lb-block-3h)
 same => n,Hangup()
 same => n(playday),Playback(custom/lb-block-day-reactivation)
 same => n,Hangup()
 same => n(playtom),Playback(custom/lb-block-tomorrow)
 same => n,Hangup()
 same => n(playbusy),Playback(custom/lb-cid-busy)
 same => n,Hangup()

; ── голосовой агент Pleep ──
; Один вход для всех трёх случаев: нерабочее время, никто не взял трубку и
; исходящий AI-звонок по молчанию клиента в WhatsApp.
;
; CallerID = номер клиента: по нему агент находит человека в CRM. Telnyx может
; отбить подменённый номер (мы им не владеем) — тогда повторяем со своим DID, и
; клиента агент определяет по переданному хабом LB_AI_PHONE.
[lb-ai-pleep]
; Публичного номера агента для звонка «снаружи» больше нет (старый +16464256862
; ни к чему не привязан) — единственный путь к агенту теперь sip.rtc.elevenlabs.io
; через [pleep_out] (pjsip_pleep.conf). Без PSTN-резерва: дозвониться на
; несуществующий номер через Telnyx означало бы просто попасть на нашу же линию.
exten => s,1,NoOp(LB AI -> pleep_out ${LB_PLEEP_NUMBER} client=${LB_PHONE} lead=${LB_AI_LEAD})
 same => n,Set(LB_BRANCH=ai)
 same => n,ExecIf($["${LB_AI_NUMBER}"!=""]?Set(LB_PLEEP_NUMBER=${LB_AI_NUMBER}))
 same => n,ExecIf($["${LB_PHONE}"!=""]?Set(CALLERID(num)=${LB_PHONE}))
 same => n,Dial(PJSIP/${LB_PLEEP_NUMBER}@pleep_out,${LB_AI_RING})
 same => n,NoOp(LB AI pleep status=${DIALSTATUS} sec=${ANSWEREDTIME})
 same => n,Hangup()

; исходящий AI-звонок: хаб зовёт через AMI
;   Action: Originate, Channel: Local/<номер>@lb-ai-outbound,
;   Context: lb-ai-connect, Exten: s  (см. tilda-webhook/app/ami.py)
; Сначала поднимаем клиента с нашего DID и только потом соединяем с агентом —
; иначе агент говорил бы в тишину, пока идут гудки, и тратил минуты тарифа.
[lb-ai-outbound]
exten => _X.,1,NoOp(LB AI OUT ${EXTEN} lead=${LB_AI_LEAD})
 same => n,Set(LB_DIRECTION=out)
 same => n,Set(LB_BRANCH=ai)
 same => n,Set(LB_PHONE=${EXTEN})
 ; 0 — недозвон уходит в /internal/call/finished: задачу «перезвонить» здесь не
 ; ставим, ветку недозвона закрывает лид-машина (SMS RingCentral)
 same => n,Set(LB_TRIED=0)
 same => n,Set(CHANNEL(hangup_handler_push)=lb-hangup,s,1)
 same => n,Set(LB_REC=${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-ai-${UNIQUEID})
 same => n,MixMonitor(${RECORDING_DIR}/${LB_REC}.wav,b)
 same => n,Set(LB_E164=${FILTER(0-9,${EXTEN})})
 same => n,ExecIf($[${LEN(${LB_E164})} = 10]?Set(LB_E164=1${LB_E164}))
 same => n,Set(LB_E164=+${LB_E164})
 same => n,Set(CALLERID(num)=${LB_AI_CID})
 same => n,Set(CALLERID(name)=${LB_AI_CID})
 same => n,Dial(PJSIP/${LB_E164}@telnyx,${LB_AI_RING})
 same => n,NoOp(LB AI out status=${DIALSTATUS} sec=${ANSWEREDTIME})
 same => n,Hangup()

; агент звонит сам (исходящий из панели Pleep) — выпускаем в Telnyx с его DID,
; чтобы клиент видел тот же номер, с которого агент отвечает на входящие
[from-pleep]
exten => _+X.,1,Goto(${EXTEN:1},1)
exten => _X.,1,NoOp(LB PLEEP OUT ${EXTEN} cid=${CALLERID(num)} uid=${UNIQUEID})
 same => n,Set(LB_DIRECTION=out)
 same => n,Set(LB_BRANCH=ai)
 same => n,Set(LB_PHONE=${EXTEN})
 same => n,Set(LB_TRIED=0)
 same => n,Set(CHANNEL(hangup_handler_push)=lb-hangup,s,1)
 same => n,Set(LB_REC=${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-ai-${UNIQUEID})
 same => n,MixMonitor(${RECORDING_DIR}/${LB_REC}.wav,b)
 same => n,Set(LB_E164=${FILTER(0-9,${EXTEN})})
 same => n,ExecIf($[${LEN(${LB_E164})} = 10]?Set(LB_E164=1${LB_E164}))
 same => n,Set(LB_E164=+${LB_E164})
 same => n,Set(CALLERID(num)=${LB_PLEEP_CID})
 same => n,Set(CALLERID(name)=${LB_PLEEP_CID})
 same => n,Dial(PJSIP/${LB_E164}@telnyx,60)
 same => n,NoOp(LB PLEEP out status=${DIALSTATUS} sec=${ANSWEREDTIME})
 same => n,Hangup()

; клиент взял трубку — соединяем его с агентом
[lb-ai-connect]
exten => s,1,NoOp(LB AI connect lead=${LB_AI_LEAD} client=${LB_AI_PHONE})
 same => n,Set(LB_PHONE=${LB_AI_PHONE})
 same => n,Goto(lb-ai-pleep,s,1)

; ── итог звонка в хаб ──
; Скрипт запускается в фоне: конвертирует запись в mp3 и зовёт хаб. Пустой
; ANSWEREDTIME = разговора не было, тогда решает LB_TRIED — дошли ли до людей.
[lb-hangup]
exten => s,1,NoOp(LB hangup uid=${UNIQUEID} status=${DIALSTATUS} sec=${ANSWEREDTIME} tried=${LB_TRIED} branch=${LB_BRANCH} ext=${LB_EXT_NUM})
 ; Добавочный ответившего обычно ставит приоритет `done` после Dial, но когда
 ; трубку первым кладёт клиент, канал уходит в hangup прямо из Dial и до `done`
 ; дело не доходит: все входящие приезжали в хаб без ext, Kommo подписывал
 ; примечание пользователем интеграции, и журнал карточки выглядел как звонки
 ; одного человека (жалоба 02.09.2026). DIALEDPEERNAME на канале уже есть.
 same => n,ExecIf($["${LB_EXT_NUM}"="" & "${DIALEDPEERNAME}"!=""]?Set(LB_EXT_NUM=${FILTER(0-9,${CUT(CUT(DIALEDPEERNAME,/,2),-,1)})}))
 same => n,TrySystem(/usr/local/bin/lb-call-report.sh "${UNIQUEID}" "${LB_PHONE}" "${LB_DIRECTION}" "${ANSWEREDTIME}" "${DIALSTATUS}" "${LB_REC}" "${LB_DID}" "${LB_TRIED}" "${LB_BRANCH}" "${LB_CLIENT_MINSEC}" "${LB_EXT_NUM}" &)
 same => n,Return()

; ── прогон без телефона ──
; asterisk -rx 'channel originate Local/8888@lb-test application Wait 60'
;   8888 — входящий на линию 1 от неизвестного номера (никто не берёт → задача)
;   8889 — то же на линию 3 (прямой номер Елены)
;   8886 — входящий, где вместо добавочных отвечает автоответчик (проверка
;          отвеченного звонка, записи и ссылки в Kommo)
; Ветка «2 — обслуживание» (Полина, 102), вместо реального добавочного —
; локальный ответчик: asterisk -rx 'channel originate Local/8884@lb-test extension 8885@lb-test'
;   8884 — Полина ответила и говорила → звонок с записью в карточке
;   8883 — Полина не взяла трубку → задача «перезвонить» на неё
;   8885 — «звонящий», который через 5 секунд жмёт 2
[lb-test]
exten => 8888,1,Set(CALLERID(num)=15005550111)
 same => n,Set(LB_DID=1)
 same => n,Goto(lb-inbound,start,1)
exten => 8889,1,Set(CALLERID(num)=15005550113)
 same => n,Set(LB_DID=3)
 same => n,Goto(lb-inbound,start,1)
exten => 8886,1,Set(CALLERID(num)=15005550112)
 same => n,Set(LB_DID=1)
 same => n,Set(LB_TECH=Local)
 same => n,Set(LB_SUFFIX=@lb-answer)
 same => n,Goto(lb-inbound,start,1)
exten => 8884,1,Set(CALLERID(num)=15005550114)
 same => n,Set(LB_DID=1)
 same => n,Set(LB_SERVICE_DIAL=Local/109@lb-answer-long)
 same => n,Goto(lb-inbound,start,1)
exten => 8883,1,Set(CALLERID(num)=15005550115)
 same => n,Set(LB_DID=1)
 same => n,Set(LB_SERVICE_DIAL=Local/109@lb-noanswer)
 same => n,Goto(lb-inbound,start,1)
; 8870 — дым-тест облачного транка: звонок на автоответчик 1-800-444-4444
; (называет номер звонящего) с настоящим DID и записью, без хаба и Kommo.
;   asterisk -rx 'channel originate Local/8870@lb-test application Wait 45'
exten => 8870,1,Set(CALLERID(num)=+18187911783)
 same => n,Set(CALLERID(name)=+18187911783)
 same => n,MixMonitor(/tmp/telnyx-test-${UNIQUEID}.wav,b)
 same => n,Dial(PJSIP/+18004444444@telnyx,40)
 same => n,NoOp(LB telnyx test status=${DIALSTATUS} sec=${ANSWEREDTIME})
 same => n,Hangup()
; 8871 — петля: звоним со своего DID на свой же DID через Telnyx и проверяем,
; что входящий возвращается снаружи ([from-telnyx] → [lb-telnyx-loop]).
;   asterisk -rx 'dialplan set global LB_SELFTEST 1'
;   asterisk -rx 'channel originate Local/8871@lb-test application Wait 45'
exten => 8871,1,Set(CALLERID(num)=${LB_TELNYX_DID_101})
 same => n,Set(CALLERID(name)=${LB_TELNYX_DID_101})
 same => n,MixMonitor(/tmp/telnyx-loop-${UNIQUEID}.wav,b)
 ; цифру в линию шлёт «звонящая» нога 8885 (Wait 5 → SendDTMF 2) — так же, как в
 ; тестах меню: asterisk -rx 'channel originate Local/8871@lb-test extension 8885@lb-test'
 same => n,Dial(PJSIP/${LB_TELNYX_DID_102}@telnyx,40)
 same => n,NoOp(LB telnyx loop status=${DIALSTATUS} sec=${ANSWEREDTIME})
 same => n,Hangup()
; 8872 — исходящий «как от менеджера»: CallerID = добавочный, дальше обычный
; lb-outbound. Проверяет, что добавочный доходит до хаба (автор звонка в Kommo) и
; что запись кодируется новым профилем. Номер 1-800-444-4444 — автоответчик, в
; Kommo карточка не создаётся (исходящий в неизвестный номер).
;   asterisk -rx 'channel originate Local/8872@lb-test application Wait 45'
exten => 8872,1,Set(CALLERID(num)=103)
 same => n,Set(LB_NUM=18004444444)
 same => n,Goto(lb-outbound,start,1)
; 8873 — дым-тест голосового агента Pleep: звоним на его номер со своего DID и
; пишем разговор. Проверяет ровно одно — агент снимает трубку и говорит.
;   asterisk -rx 'channel originate Local/8873@lb-test application Wait 60'
;   asterisk -rx 'core show channels'   ; и потом /tmp/pleep-test-*.wav
; 8874 — то же для 101 (Павел, владелец, с 24.08.2026): проверяет, что его
; добавочный доходит до хаба и звонок подписывается им, а не Александрой.
;   asterisk -rx 'channel originate Local/8874@lb-test application Wait 45'
exten => 8874,1,Set(CALLERID(num)=101)
 same => n,Set(LB_NUM=18004444444)
 same => n,Goto(lb-outbound,start,1)
exten => 8873,1,Set(CALLERID(num)=${LB_AI_CID})
 same => n,Set(CALLERID(name)=${LB_AI_CID})
 same => n,MixMonitor(/tmp/pleep-test-${UNIQUEID}.wav,b)
 same => n,Dial(PJSIP/${LB_PLEEP_NUMBER}@pleep_out,${LB_AI_RING})
 same => n,NoOp(LB pleep test status=${DIALSTATUS} sec=${ANSWEREDTIME})
 same => n,Hangup()
exten => 8885,1,Wait(5)
 same => n,SendDTMF(2)
 same => n,Wait(60)
 same => n,Hangup()

; ответчик для петли самопроверки Telnyx: снимает трубку, играет то же меню,
; что слышит клиент, и кладёт трубку — хаб и Kommo не задействованы
[lb-telnyx-loop]
exten => s,1,NoOp(LB telnyx loop IN did=${LB_TO4} cid=${CALLERID(num)})
 same => n,Answer()
 same => n,Wait(1)
 same => n,Read(LB_LOOP_DTMF,custom/lb-menu,1,,1,8)
 same => n,NoOp(LB telnyx loop DTMF=${LB_LOOP_DTMF})
 same => n,Wait(1)
 same => n,Hangup()

[lb-answer]
exten => _X.,1,Answer()
 same => n,Playback(demo-thanks)
 same => n,Wait(2)
 same => n,Hangup()

; ответили и говорили дольше порога LB_CLIENT_MINSEC
[lb-answer-long]
exten => _X.,1,Answer()
 same => n,Playback(demo-thanks)
 same => n,Wait(25)
 same => n,Hangup()

; звоним, но трубку не берут — Dial отвалится по таймауту LB_CLIENT_RING
[lb-noanswer]
exten => _X.,1,Ringing()
 same => n,Wait(60)
 same => n,Hangup()
