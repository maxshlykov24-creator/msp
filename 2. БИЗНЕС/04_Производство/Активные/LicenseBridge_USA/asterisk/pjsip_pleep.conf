;
; Голосовой агент Pleep = SIP-транкинг ElevenLabs. Подтверждено поддержкой
; Pleep 11.08 и документацией https://elevenlabs.io/docs/eleven-agents/phone-numbers/sip-trunking:
; это НЕ обычный SIP-транк с двусторонней регистрацией, а два независимых
; статических плеча:
;
;   к агенту (мы звоним)   — [pleep_out]: наш Asterisk сам шлёт INVITE на общий
;     адрес sip.rtc.elevenlabs.io:5060 (TCP). Идентификатор в URI — номер,
;     который импортирован в ElevenLabs/Pleep как «Номер телефона» SIP-транка
;     (сейчас +18188066735, DID линии 103 — старый номер +16464256862 больше
;     не привязан ни к чему). Авторизация — по ACL нашего исходящего IP
;     (159.65.97.156/32), его мы уже вписали в «Разрешённые IP-адреса» в
;     панели Pleep — пароль тут не нужен.
;   от агента (нам звонят) — [pleep]: агент сам шлёт INVITE на наш адрес
;     159.65.97.156 (это поле «Адрес» в их панели), с digest-логином
;     pleepai/пароль из pjsip_pleep_auth.conf. Регистрации здесь тоже нет —
;     ElevenLabs никогда не шлёт REGISTER, только INVITE напрямую.
;
; Подключается из /etc/asterisk/pjsip.conf строкой:
;   #include "pjsip_pleep.conf"
;
; Логин/пароль лежат только на сервере в /etc/asterisk/pjsip_pleep_auth.conf
; (секция [pleep_auth], chmod 640 root:asterisk) — в репозитории их нет.
;
#include "pjsip_pleep_auth.conf"

; ── к агенту: мы звоним на sip.rtc.elevenlabs.io ──
[pleep_out]
type=aor
; общий адрес ElevenLabs балансирует между узлами — статический contact, а не
; результат регистрации (её тут в принципе не бывает)
contact=sip:sip.rtc.elevenlabs.io:5060\;transport=tcp
; их узлы за одним DNS-именем не обязаны одинаково отвечать на OPTIONS —
; qualify молчание превратил бы рабочий транк в вечный "Unavailable"
qualify_frequency=0

[pleep_out]
type=endpoint
context=from-pleep
transport=transport-tcp
aors=pleep_out
; их сторона (realm "LiveKit") ответила 407 на чистый ACL — трансk требует
; digest и на исходящее плечо, используем тот же логин/пароль из панели Pleep
outbound_auth=pleep_auth
disallow=all
allow=ulaw
allow=alaw
dtmf_mode=rfc4733
direct_media=no
rtp_symmetric=yes
force_rport=yes
; ACK на 200 OK и так идёт на Contact (RFC 3261). rewrite_contact=yes наоборот
; отправил ACK на IP балансировщика 136.112.48.140 вместо узла диалога.
rewrite_contact=no
rtp_keepalive=1
timers=no
send_rpid=yes
language=en
; From @sip.rtc.elevenlabs.io выглядел как их внутренний вызов.
from_domain=159.65.97.156

; ── от агента: ElevenLabs звонит на наш IP ──
[pleep]
type=aor
max_contacts=2
remove_existing=yes
qualify_frequency=0
minimum_expiration=60
default_expiration=120
maximum_expiration=3600

[pleep]
type=endpoint
context=from-pleep
transport=transport-udp
; Pleep может представиться и логином, и номером линии — берём обоих
identify_by=auth_username,username
auth=pleep_auth
aors=pleep
disallow=all
allow=ulaw
allow=alaw
dtmf_mode=rfc4733
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
trust_id_inbound=yes
send_rpid=yes
language=en
