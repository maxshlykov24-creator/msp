# Внутренний nginx контейнера web: статика SPA + проксирование на api.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Не кэшировать service worker и манифест агрессивно
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # API — без Upgrade/Connection (Safari iOS)
  location /api/ {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Явно пробрасываем JWT — иначе часть клиентов ловят 401 на POST.
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection "";
    proxy_connect_timeout 15s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    proxy_buffering on;
    proxy_request_buffering on;
  }

  # WebSocket
  location /ws {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_buffering off;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
