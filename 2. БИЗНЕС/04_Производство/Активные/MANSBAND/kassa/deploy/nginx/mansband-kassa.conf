# Host-nginx на VPS: терминирует HTTPS (certbot) и проксирует на web-контейнер
# (127.0.0.1:8080). Важно: Upgrade/Connection только для /ws —
# на обычных /api Safari iOS иначе зависает (Connection: close/upgrade на POST).
#
# Установка:
#   sudo cp deploy/nginx/mansband-kassa.conf /etc/nginx/sites-available/mansband-kassa
#   # затем certbot или руками ssl listen/certificates
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name mansband-kassa.ru www.mansband-kassa.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Публичные доски воронок (HTML, без логина кассы)
    location /boards/ {
        alias /var/www/mansband-boards/;
        index index.html;
        add_header Cache-Control "no-cache";
    }

    # WebSocket — отдельный location с upgrade
    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # API — без WebSocket-заголовков (критично для Safari)
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_connect_timeout 15s;
        proxy_send_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}

# В http {} должен быть:
#   map $http_upgrade $connection_upgrade { default upgrade; '' close; }
