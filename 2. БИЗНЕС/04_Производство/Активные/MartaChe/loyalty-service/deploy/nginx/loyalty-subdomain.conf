# Отдельный поддомен только под loyalty (Tilda на основном домене не трогаем).
# Подставьте server_name и раскомментируйте ssl / или получите certbot (см. timeweb-nginx-subdomain.sh).
#
# Прокси весь трафик на uvicorn: на этом хосте нет Tilda, только API.
# Несколько server_name в одной строке — вручную (новый + старый *.twc1.net).
# LE на *.twc1.net: общий лимит 50/неделю на зону twc1.net; при лимите — SSL в панели Timeweb.

upstream loyalty_api {
    server 127.0.0.1:18080;
}

server {
    listen 80;
    listen [::]:80;
    server_name __LOYALTY_FQDN__;

    # HTTP-01 (certbot, acme.sh): файлы must лежат под document root, не в proxy
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/letsencrypt;
    }

    location / {
        proxy_pass http://loyalty_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 4m;
    }
}
