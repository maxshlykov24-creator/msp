<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2MY — Вход в аналитику</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#ffffff;
    --cream:#f7f7f7;
    --butter:#fffbe8;
    --ink:#020202;
    --body:#4f5354;
    --mute:#8c9092;
    --line:#e1e3e5;
    --sans:'Roboto',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --serif:'Merriweather',Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    font-family:var(--sans);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--cream);
    -webkit-font-smoothing:antialiased;
  }
  .stage{position:fixed;inset:0;z-index:0;background:var(--cream)}
  .stage-logo{
    position:absolute;inset:0;
    background:url('/assets/logo-2my.png') center 46% / min(920px, 88vw) auto no-repeat;
    opacity:.07;
    animation:logoIn 1.4s cubic-bezier(.25,1,.5,1) both;
  }
  .stage-vignette{
    position:absolute;inset:0;
    background:
      radial-gradient(ellipse 60% 50% at 50% 46%, transparent 0%, rgba(247,247,247,.2) 42%, var(--cream) 76%),
      linear-gradient(180deg, rgba(247,247,247,.65) 0%, transparent 24%, transparent 62%, var(--cream) 100%);
  }
  .wrap{
    position:relative;z-index:1;
    width:100%;max-width:440px;
    padding:24px;
    animation:cardIn 1.1s cubic-bezier(.25,1,.5,1) .12s both;
  }
  .brand{
    text-align:center;
    font-size:11px;
    font-weight:700;
    letter-spacing:.28em;
    text-transform:uppercase;
    color:var(--mute);
    margin-bottom:16px;
  }
  .card{
    background:var(--paper);
    border:1px solid var(--line);
    padding:40px 36px 32px;
    box-shadow:0 24px 60px -28px rgba(2,2,2,.28);
  }
  .title{
    font-family:var(--serif);
    font-weight:400;
    font-size:28px;
    letter-spacing:-.02em;
    text-align:center;
    line-height:1.2;
    margin-bottom:28px;
  }
  label{
    display:block;
    font-size:10px;
    font-weight:700;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--mute);
    margin:0 0 8px;
  }
  .field{margin-bottom:16px}
  input{
    width:100%;
    background:var(--paper);
    color:var(--ink);
    border:1px solid var(--line);
    border-radius:0;
    padding:12px 14px;
    font-size:15px;
    font-family:var(--sans);
    outline:none;
  }
  input::placeholder{color:#b0b4b6}
  input:hover{border-color:#c5c8ca}
  input:focus{border-color:var(--ink)}
  button{
    width:100%;
    margin-top:8px;
    background:var(--ink);
    color:#fff;
    border:none;
    border-radius:0;
    padding:14px;
    font-size:12px;
    font-weight:700;
    letter-spacing:.16em;
    text-transform:uppercase;
    cursor:pointer;
    font-family:var(--sans);
    transition:background .3s cubic-bezier(.25,1,.5,1);
  }
  button:hover{background:#191919}
  .err{
    background:var(--butter);
    color:var(--ink);
    border:1px solid var(--line);
    font-size:13px;
    padding:10px 12px;
    margin-bottom:18px;
    text-align:center;
    display:none;
  }
  .err.show{display:block;animation:shake .35s ease}
  .foot{
    margin-top:22px;
    text-align:center;
    font-size:10px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--mute);
  }
  @keyframes logoIn{from{opacity:0}to{opacity:.07}}
  @keyframes cardIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    25%{transform:translateX(-4px)}
    75%{transform:translateX(4px)}
  }
  @media (max-width:480px){
    .wrap{padding:16px}
    .card{padding:32px 22px 26px}
    .title{font-size:24px}
  }
  @media (prefers-reduced-motion:reduce){
    .stage-logo,.wrap,.err{animation:none}
  }
</style>
</head>
<body>
  <div class="stage" aria-hidden="true">
    <div class="stage-logo"></div>
    <div class="stage-vignette"></div>
  </div>
  <div class="wrap">
    <div class="brand">2MY</div>
    <form class="card" method="post" action="/login">
      <div class="title">Вход в аналитику</div>
      <div class="err" id="err">Неверный логин или пароль</div>
      <label for="login">Логин</label>
      <div class="field">
        <input id="login" name="login" type="text" autocomplete="username" autofocus required placeholder="Логин">
      </div>
      <label for="password">Пароль</label>
      <div class="field">
        <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Пароль">
      </div>
      <button type="submit">Войти</button>
      <div class="foot">Панель 2MyMoods</div>
    </form>
  </div>
  <script>
    if (new URLSearchParams(location.search).get('e')) document.getElementById('err').classList.add('show');
  </script>
</body>
</html>
