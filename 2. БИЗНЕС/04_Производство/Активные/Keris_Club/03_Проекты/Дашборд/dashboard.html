  <meta name="theme-color" content="#fafaf2">
  <title>Keris Club — пульс</title>

  <script>
    (function(){
      var tg=window.Telegram&&window.Telegram.WebApp;
      if(!tg)return;
      var expand=function(){
        try{tg.ready()}catch(e){}
        try{tg.expand()}catch(e){}
      };
      expand();
      document.addEventListener("DOMContentLoaded",expand);
      window.addEventListener("load",expand);
      setTimeout(expand,0);setTimeout(expand,50);setTimeout(expand,200);setTimeout(expand,600);
      try{tg.onEvent("viewportChanged",function(){if(!tg.isExpanded)expand();});}catch(e){}
    })();

  <style>
    :root{
      --bg:#fafaf2;--surface:#fff;--soft:#f4efe8;--line:#ebe4da;
      --text:#4a3c36;--muted:#a99a93;--rose:#e0a8bb;--rose-dark:#c98da5;
      --gold:#d4b88a;--green:#6a9a82;--danger:#c46b6b;--shadow:0 18px 50px rgba(120,90,85,.10);
      --safe-bottom:env(safe-area-inset-bottom,0px);
      --safe-top:env(safe-area-inset-top,0px);
      --safe-right:env(safe-area-inset-right,0px);
      --safe-left:env(safe-area-inset-left,0px);
      --browser-bar:0px;
      --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    }
    *{box-sizing:border-box}
    html{min-height:100%;background:var(--bg)}
    body{margin:0;min-height:100%;color:var(--text);font-family:var(--font);
      background:
        radial-gradient(700px 420px at 100% 0,rgba(224,168,187,.08),transparent 62%),
        radial-gradient(540px 400px at 0 100%,rgba(212,184,138,.07),transparent 65%),var(--bg);
      -webkit-font-smoothing:antialiased}
    button{font:inherit;color:inherit}
    button:focus-visible{outline:3px solid rgba(206,124,154,.3);outline-offset:2px}
    .app{width:min(100%,520px);min-height:100dvh;margin:0 auto;position:relative}
    .topbar{display:flex;align-items:center;justify-content:center;padding:10px 14px 8px;
      padding-top:max(10px,var(--safe-top))}
    .brand-logo{height:46px;width:auto;display:block;object-fit:contain;background:transparent}
    .sticky{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,var(--bg) 70%,rgba(250,250,242,.92));
      padding:0 14px 10px;padding-left:max(14px,var(--safe-left));padding-right:max(14px,var(--safe-right))}
    .segmented{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;padding:5px;background:var(--soft);border-radius:15px}
    .segmented.two{grid-template-columns:1fr 1fr 1fr}
    .segmented button{min-height:44px;border:0;border-radius:11px;background:transparent;font-weight:600;cursor:pointer}
    .segmented button.active{background:#fff;box-shadow:0 5px 16px rgba(91,68,57,.1)}
    .dir-wrap{padding:0 14px 4px;padding-left:max(14px,var(--safe-left));padding-right:max(14px,var(--safe-right))}
    .dir-wrap[hidden]{display:none}
    main{padding:8px 18px calc(28px + var(--safe-bottom) + var(--browser-bar))}
    .eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--rose-dark);font-weight:700;margin:14px 0 8px}
    .fresh{font-size:11px;color:var(--muted);text-align:center;margin:8px 0 0}
    .range-wrap{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
    .range-wrap[hidden]{display:none}
    .range-wrap label{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;background:#fff;border:1px solid var(--line);border-radius:12px;font-size:13px;font-weight:600;color:var(--muted)}
    .range-wrap.custom label{border-color:var(--rose)}
    .range-wrap input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-weight:600;color:var(--text);min-height:42px;padding:0}
    .who{font-size:13px;font-weight:700;margin:14px 0 2px}
    .banner{display:none;margin:8px 0 12px;padding:12px 14px;border-radius:14px;font-size:13px;line-height:1.45;
      background:rgba(196,107,107,.10);border:1px solid rgba(196,107,107,.35);color:#a8332c}
    .banner.show{display:block}
    .pulse-hero{margin-top:4px;border-radius:22px;padding:18px 17px 16px;color:#fff;
      background:linear-gradient(135deg,#6b5348,#8d6c5c);box-shadow:var(--shadow)}
    .pulse-hero .tag{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.72)}
    .pulse-hero .num{font-size:clamp(32px,10vw,44px);font-weight:700;letter-spacing:-.03em;line-height:1;margin-top:8px}
    .pulse-hero .sub{margin:8px 0 0;font-size:12px;color:rgba(255,255,255,.84);line-height:1.45}
    .trust{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0 8px}
    .trust.cols-2{grid-template-columns:1fr 1fr}
    .trust.cols-1{grid-template-columns:1fr}
    .trust div{padding:10px 6px;text-align:center;border-radius:14px;background:rgba(255,255,255,.92);border:1px solid var(--line)}
    .trust b{display:block;font-size:14px;font-weight:700;letter-spacing:-.03em;line-height:1.2;overflow-wrap:anywhere}
    .trust span{display:block;font-size:9px;color:var(--muted);margin-top:3px;line-height:1.2}
    .chapter{margin-top:16px;padding:6px 12px 14px;border-radius:24px;border:1px solid var(--line)}
    .chapter[data-ch="pet"]{background:#fffaf3;box-shadow:inset 0 4px 0 #d4b88a}
    .chapter[data-ch="groom"]{margin-top:22px;background:#fff7f9;box-shadow:inset 0 4px 0 #e0a8bb}
    .chapter .eyebrow{margin:12px 2px 8px}
    .chapter[data-ch="pet"] .eyebrow{color:#9a7b4a}
    .chapter[data-ch="pet"] .pulse-hero{background:linear-gradient(135deg,#6b5348,#9a7a58)}
    .chapter[data-ch="groom"] .eyebrow{color:var(--rose-dark)}
    .chapter[data-ch="groom"] .pulse-hero{background:linear-gradient(135deg,#7d5364,#c48aa3)}
    .chapter .chips{margin-left:-12px;margin-right:-12px;padding-left:12px;padding-right:12px}
    .funnel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px 16px}
    .funnel-row{margin-top:10px}
    .funnel-row:first-child{margin-top:0}
    .funnel-row .lab{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:600}
    .funnel-row .lab small{color:var(--muted);font-weight:500}
    .bar{height:8px;border-radius:999px;background:#f1e6e8;overflow:hidden;margin-top:7px}
    .bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(135deg,var(--rose),var(--gold))}
    .source-line{margin-top:12px;font-size:12px;color:#6f5b52;line-height:1.45}
    .chips{display:flex;gap:8px;overflow:auto;margin:10px -18px 4px;padding:0 18px 5px;scrollbar-width:none}
    .chips::-webkit-scrollbar{display:none}
    .chip{min-height:40px;padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:#fff;white-space:nowrap;font-weight:600;cursor:pointer}
    .chip.active{color:#fff;border-color:transparent;background:linear-gradient(135deg,var(--rose),var(--gold))}
    .cab-card{width:100%;text-align:left;display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);
      border-radius:18px;padding:13px 14px;margin-top:8px}
    .cab-card .vdate{flex:0 0 46px;text-align:center;line-height:1.15}
    .cab-card .vdate b{display:block;font-size:17px;font-weight:600}
    .cab-card .vdate small{font-size:10px;color:var(--muted)}
    .cab-card .vmain{flex:1;min-width:0}
    .cab-card .vmain b{display:block;font-size:13px;font-weight:600}
    .cab-card .vmain small{display:block;color:var(--muted);font-size:11px;margin-top:3px;line-height:1.35}
    .pill{display:inline-flex;align-items:center;min-height:20px;border-radius:999px;padding:2px 7px;font-size:10px;font-weight:600}
    .pill.up{background:#f7dde6;color:#8d5d72}
    .pill.ok{background:#e4f0e8;color:#4d7a62}
    .now-line{margin-top:10px;padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:18px}
    .now-line b{display:block;font-size:14px;font-weight:700}
    .now-line span{display:block;color:var(--muted);font-size:12px;margin-top:4px;line-height:1.4}
    .empty{text-align:center;padding:40px 20px;background:#fff;border:1px solid var(--line);border-radius:22px;margin-top:10px}
    .empty .big{font-size:42px}.empty h3{margin:10px 0 5px}.empty p{font-size:13px;color:var(--muted);line-height:1.5}
    .boot{text-align:center;color:var(--muted);font-size:14px;padding:48px 20px}
    html.tg-webapp{--browser-bar:56px}
    html.tg-webapp .sticky{padding-top:4px}
  </style>
</head>

const STORAGE = "keris-pulse";

function n(v){return Number(v||0).toLocaleString("ru-RU")}
function rub(v){return n(v)+" ₽"}
function plural(num, one, few, many){
  var n10 = num % 10, n100 = num % 100;
  if(n10 === 1 && n100 !== 11) return one;
  if(n10 >= 2 && n10 <= 4 && (n100 < 12 || n100 > 14)) return few;
  return many;
}
function zayavok(num){ return n(num) + " " + plural(num, "заявка", "заявки", "заявок"); }
function vizitov(num){ return n(num) + " " + plural(num, "визит", "визита", "визитов"); }
function pct(part, of){
  if(!of || of < 20) return "";
  return Math.round(part * 100 / of) + "%";
}
function ageLabel(mins, stamp){
  if(stamp) return "обновлено " + stamp;
  if(mins == null) return "цифры ещё собираются";
  if(mins < 1) return "обновлено только что";
  if(mins < 60) return "обновлено " + Math.round(mins) + " мин назад";
  var h = Math.round(mins / 60);
  return "обновлено " + h + " ч назад";
}
function anchorDate(D){
  if(D.today && D.today.date) return D.today.date;
  var d = new Date();
  var m = String(d.getMonth() + 1).padStart(2, "0");
  var day = String(d.getDate()).padStart(2, "0");
  return d.getFullYear() + "-" + m + "-" + day;
}
function shiftIso(iso, days){
  var p = iso.split("-").map(Number);
  var d = new Date(Date.UTC(p[0], p[1] - 1, p[2]));
  d.setUTCDate(d.getUTCDate() + days);
  var m = String(d.getUTCMonth() + 1).padStart(2, "0");
  var day = String(d.getUTCDate()).padStart(2, "0");
  return d.getUTCFullYear() + "-" + m + "-" + day;
}
function shortDate(iso){
  var p = iso.split("-");
  return String(Number(p[2])) + "." + p[1];
}
function rangeLabel(from, to){
  if(from.slice(0, 4) !== to.slice(0, 4)){
    return shortDate(from) + "." + from.slice(0, 4) + " по " + shortDate(to) + "." + to.slice(0, 4);
  }
  return shortDate(from) + " по " + shortDate(to);
}

function readUi(){
  var q = new URLSearchParams(location.search);
  var ls = {};
  try{ls = JSON.parse(localStorage.getItem(STORAGE) || "{}")}catch(e){}
  var period = q.get("period") || ls.period || "month";
  return {
    period: period,
    dir: q.get("dir") || ls.dir || "all",
    master: ls.master || "all",
    from: (period === "range" ? (q.get("from") || ls.from) : (ls.from || "")) || "",
    to: (period === "range" ? (q.get("to") || ls.to) : (ls.to || "")) || ""
  };
}
function writeUi(ui){
  localStorage.setItem(STORAGE, JSON.stringify({
    period: ui.period, dir: ui.dir, master: ui.master, from: ui.from || "", to: ui.to || ""
  }));
  var url = new URL(location.href);
  url.searchParams.set("period", ui.period);
  if(ui.period === "today") url.searchParams.delete("dir");
  else url.searchParams.set("dir", ui.dir);
  if(ui.period === "range" && ui.from && ui.to){
    url.searchParams.set("from", ui.from);
    url.searchParams.set("to", ui.to);
  } else {
    url.searchParams.delete("from");
    url.searchParams.delete("to");
  }
  history.replaceState(null, "", url.pathname + url.search + url.hash);
}

function setActive(root, attr, value){
  root.querySelectorAll("button").forEach(function(b){
    b.classList.toggle("active", b.getAttribute(attr) === value);
  });
}

function card(task){
  return '<div class="cab-card"><div class="vdate"><b>•</b><small>' + (task.badge || "сейчас") +
    '</small></div><div class="vmain"><b>' + task.title + '</b><small>' + (task.sub || "") +
    '</small></div></div>';
}

function trustTile(value, label){
  return '<div><b>' + value + '</b><span>' + label + '</span></div>';
}
function hoursPair(load){
  if(!load || !load.show) return "";
  return n(load.occupied_h) + " из " + n(load.available_h) + " ч";
}

function combinedHero(k, g, label){
  var sold = (k && k.sold_sum) || 0;
  var salon = (g && g.revenue) || 0;
  if(!sold || !salon) return "";
  return '<div class="pulse-hero" style="margin-bottom:8px"><div class="tag">деньги · ' + label + '</div>' +
    '<div class="num">' + rub(sold + salon) + '</div></div>';
}

function funnelHtml(funnel, source){
  funnel = funnel || [];
  if(!funnel.length) return '<p class="source-line">За этот срок заявок нет.</p>';
  var max = Math.max.apply(null, funnel.map(function(s){return s.count}) ) || 1;
  var rows = funnel.map(function(s){
    var w = Math.max(4, Math.round(s.count * 100 / max));
    var extra = pct(s.count, funnel[0] ? funnel[0].count : 0);
    return '<div class="funnel-row"><div class="lab"><span>' + s.name + '</span><small>' +
      n(s.count) + (extra && s !== funnel[0] ? ' · ' + extra : '') +
      '</small></div><div class="bar"><i style="width:' + w + '%"></i></div></div>';
  }).join("");
  var src = "";
  if(source && source.name && source.of){
    src = '<p class="source-line">Больше всего с ' + source.name + ', ' + n(source.count) +
      ' из ' + n(source.of) + '.</p>';
  }
  return '<div class="funnel">' + rows + src + '</div>';
}

function masterBars(masters, filterId){
  var rows = masters.filter(function(m){return filterId === "all" || m.id === filterId});
  if(!rows.length) return '<div class="empty"><div class="big">·</div><h3>Нет визитов</h3><p>У этого мастера в срезе пусто.</p></div>';
  var max = Math.max.apply(null, rows.map(function(m){return m.visits})) || 1;
  return '<div class="funnel">' + rows.map(function(m){
    var w = Math.max(4, Math.round(m.visits * 100 / max));
    return '<div class="funnel-row"><div class="lab"><span>' + m.name + '</span><small>' +
      n(m.visits) + ' · ' + rub(m.revenue) +
      (m.available_h && Number(m.occupied_h || 0) <= Number(m.available_h)
        ? ' · ' + n(m.occupied_h || 0) + ' из ' + n(m.available_h) + ' ч' : '') +
      '</small></div><div class="bar"><i style="width:' + w + '%"></i></div></div>';
  }).join("") + '</div>';
}

function kennelChapter(block, periodLabel){
  block = block || {};
  var tiles = [
    trustTile(n(block.booked || 0), "бронь"),
    trustTile(n(block.sold || 0), "продали"),
    trustTile(rub(block.avg_check || 0), "средний чек")
  ];
  var details = funnelHtml(block.funnel || [], block.show_source ? block.top_source : null);
  return '<section class="chapter" data-ch="pet">' +
    '<div class="eyebrow">Питомник</div>' +
    '<div class="pulse-hero"><div class="tag">новые заявки · ' + periodLabel + '</div>' +
    '<div class="num">' + n(block.leads) + '</div></div>' +
    '<div class="trust cols-' + Math.min(tiles.length, 3) + '">' + tiles.join("") + '</div>' +
    '<div class="who">Как дошли</div>' + details + '</section>';
}

function groomingChapter(block, periodLabel, ui){
  block = block || {};
  var tiles = [
    trustTile(n(block.visits || 0), "пришли"),
    trustTile(n(block.no_show || 0), "не пришли"),
    trustTile(rub(block.avg_check || 0), "средний чек")
  ];
  var heroTag = "выручка визитов · " + periodLabel;
  var heroNum = rub(block.revenue || 0);
  var masters = block.masters || [];
  if(masters.length >= 2 && ui.master !== "all" && !masters.some(function(m){ return m.id === ui.master; })){
    ui.master = "all";
    writeUi(ui);
  }
  groomMasters = masters;
  var chips = "";
  if(masters.length >= 2){
    var all = [{id:"all", name:"Все"}].concat(masters);
    chips = '<div class="chips">' + all.map(function(m){
      var on = ui.master === m.id;
      return '<button type="button" class="chip' + (on ? " active" : "") + '" data-master="' + m.id + '">' + m.name + '</button>';
    }).join("") + '</div>';
  }
  var list = masters.length
    ? masterBars(masters, masters.length >= 2 ? ui.master : "all")
    : '<p class="source-line">За этот срок визитов нет.</p>';
  var who = '<div class="who">Кто стрижёт</div>' + chips + '<div id="masterList">' + list + '</div>';
  return '<section class="chapter" data-ch="groom">' +
    '<div class="eyebrow">Груминг</div>' +
    '<div class="pulse-hero"><div class="tag">' + heroTag + '</div>' +
    '<div class="num">' + heroNum + '</div></div>' +
    '<div class="trust cols-' + Math.min(tiles.length, 3) + '">' + tiles.join("") + '</div>' +
    who + '</section>';
}

function renderToday(D){
  var t = D.today || {};
  var tasks = t.tasks || [];
  var html = '<div class="eyebrow">Сегодня</div>';
  if(!tasks.length){
    html += '<div class="empty"><div class="big">✓</div><h3>Делать нечего</h3><p>Заявок без ответа нет, платежи и записи на завтра в порядке.</p></div>';
  } else {
    html += tasks.map(card).join("");
  }
  var kn = t.kennel_new_leads;
  html += '<div class="now-line"><b>Питомник сейчас</b><span>' +
    (kn ? n(kn) + " новых заявок сегодня" : "Сегодня новых заявок нет") + '.</span></div>';
  var gv = t.grooming_visits;
  var next = t.grooming_next;
  var gLine = gv ? ("В салоне сегодня " + vizitov(gv) + (next ? ", ближайший в " + next : "")) : "В салоне сегодня визитов нет";
  html += '<div class="now-line"><b>Салон сейчас</b><span>' + gLine + '.</span></div>';
  return html;
}

var groomMasters = [];

function sumMasters(days, from, to){
  var masters = {};
  days.forEach(function(day){
    if(day.date < from || day.date > to) return;
    (day.masters || []).forEach(function(m){
      var row = masters[m.id] || {id: m.id, name: m.name, visits: 0, revenue: 0};
      row.visits += m.visits || 0;
      row.revenue += m.revenue || 0;
      if(m.name) row.name = m.name;
      masters[m.id] = row;
    });
  });
  return Object.keys(masters).map(function(id){ return masters[id]; })
    .sort(function(a, b){ return b.visits - a.visits || String(a.name).localeCompare(String(b.name), "ru"); });
}

function buildRange(D, from, to){
  var days = D.days || {};
  var gDays = days.grooming || [];
  var kDays = days.kennel || [];
  var label = rangeLabel(from, to);
  if(!gDays.length && !kDays.length){
    return {label: label, missing: true, kennel: null, grooming: null};
  }
  var g = {revenue: 0, visits: 0, no_show: 0, avg_check: 0, masters: []};
  gDays.forEach(function(day){
    if(day.date < from || day.date > to) return;
    g.visits += day.visits || 0;
    g.revenue += day.revenue || 0;
    g.no_show += day.no_show || 0;
  });
  g.avg_check = g.visits ? Math.round(g.revenue / g.visits) : 0;
  g.masters = sumMasters(gDays, from, to);
  var k = {leads: 0, booked: 0, sold: 0, sold_sum: 0, sold_cohort: 0, avg_check: 0, show_avg_check: false, show_waiting: false, show_source: false, funnel: []};
  kDays.forEach(function(day){
    if(day.date < from || day.date > to) return;
    k.leads += day.leads || 0;
    k.booked += day.booked || 0;
    k.sold += day.sold || 0;
    k.sold_sum += day.sold_sum || 0;
    k.sold_cohort += day.sold_cohort || 0;
  });
  k.avg_check = k.sold ? Math.round(k.sold_sum / k.sold) : 0;
  k.show_avg_check = k.sold > 0;
  var monthK = (((D.periods || {}).month) || {}).kennel || {};
  k.waiting_litter = monthK.waiting_litter || 0;
  k.show_waiting = !!monthK.show_waiting;
  k.funnel = [
    {name: "Заявка", count: k.leads},
    {name: "Бронь", count: k.booked},
    {name: "Продано", count: k.sold_cohort}
  ];
  var clipped = "";
  if(days.from && days.to && (from < days.from || to > days.to)){
    clipped = "В срезе дни с " + shortDate(days.from) + " по " + shortDate(days.to) + ". Более ранние даты в сумму не входят.";
  }
  return {label: label, kennel: k, grooming: g, clipped: clipped};
}

function paintMasters(ui){
  var box = document.getElementById("masterList");
  if(!box) return;
  var filter = groomMasters.length >= 2 ? ui.master : "all";
  box.innerHTML = masterBars(groomMasters, filter);
  document.querySelectorAll(".chip").forEach(function(c){
    c.classList.toggle("active", c.getAttribute("data-master") === ui.master);
  });
}

function startDashboard(D){
  var ui = readUi();
  if(["today","week","month","range"].indexOf(ui.period) < 0) ui.period = "month";
  if(["all","pet","groom"].indexOf(ui.dir) < 0) ui.dir = "all";
  var span = null;
  if(ui.period === "today") span = {from: anchorDate(D), to: anchorDate(D)};
  if(ui.period === "week") span = {from: shiftIso(anchorDate(D), -7), to: anchorDate(D)};
  if(ui.period === "month") span = {from: shiftIso(anchorDate(D), -30), to: anchorDate(D)};
  if(ui.period === "range"){
    span = {from: ui.from, to: ui.to};
    if(!span.from || !span.to){
      ui.period = "month";
      span = {from: shiftIso(anchorDate(D), -30), to: anchorDate(D)};
    } else if(span.from > span.to){
      var tmp = span.from; span.from = span.to; span.to = tmp;
    }
  }
  if(span){ ui.from = span.from; ui.to = span.to; }
  writeUi(ui);

  document.getElementById("freshLine").textContent = ageLabel(D.age_minutes, D.updated_label);
  setActive(document.getElementById("periodSeg"), "data-period", ui.period);
  setActive(document.getElementById("dirSeg"), "data-dir", ui.dir);
  document.getElementById("dirWrap").hidden = false;
  var range = document.getElementById("rangeWrap");
  range.hidden = false;
  range.classList.toggle("custom", ui.period === "range");
  if(ui.from) document.getElementById("fromDate").value = ui.from;
  if(ui.to) document.getElementById("toDate").value = ui.to;

  var root = document.getElementById("root");
  var pack;
  if(ui.period === "range" || ui.period === "today"){
    pack = buildRange(D, ui.from, ui.to);
    if(ui.period === "today" && pack && !pack.missing) pack.label = "сегодня";
  } else {
    pack = (D.periods || {})[ui.period] || {};
  }
  if(pack.missing){
    root.innerHTML = '<div class="empty"><div class="big">·</div><h3>Даты ещё собираются</h3><p>Неделя и месяц уже на экране. Свой период появится после обновления цифр.</p></div>';
    return;
  }
  var html = "";
  if(pack.clipped) html += '<div class="now-line"><b>Короткий срез</b><span>' + pack.clipped + '</span></div>';
  if(ui.dir !== "groom") html += kennelChapter(pack.kennel, pack.label || "");
  if(ui.dir !== "pet") html += groomingChapter(pack.grooming, pack.label || "", ui);
  root.innerHTML = html;
}

function bind(D){
  document.getElementById("periodSeg").addEventListener("click", function(e){
    var b = e.target.closest("button[data-period]"); if(!b) return;
    var ui = readUi(); ui.period = b.getAttribute("data-period"); writeUi(ui); startDashboard(D);
  });
  document.getElementById("dirSeg").addEventListener("click", function(e){
    var b = e.target.closest("button[data-dir]"); if(!b) return;
    var ui = readUi(); ui.dir = b.getAttribute("data-dir"); writeUi(ui); startDashboard(D);
  });
  document.getElementById("root").addEventListener("click", function(e){
    var chip = e.target.closest("[data-master]");
    if(chip){
      var ui = readUi();
      ui.master = chip.getAttribute("data-master");
      writeUi(ui);
      paintMasters(ui);
    }
  });
  function applyRange(){
    var from = document.getElementById("fromDate").value;
    var to = document.getElementById("toDate").value;
    if(!from || !to) return;
    var ui = readUi();
    ui.period = "range";
    ui.from = from;
    ui.to = to;
    writeUi(ui);
    startDashboard(D);
  }
  document.getElementById("fromDate").addEventListener("change", applyRange);
  document.getElementById("toDate").addEventListener("change", applyRange);
}

document.addEventListener("DOMContentLoaded", function(){
  if(window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData){
    document.documentElement.classList.add("tg-webapp");
  }
  /* PULSE_BOOT */
  var D = window.KERIS_PULSE_MOCK;
  bind(D);
  startDashboard(D);
});
</script>
